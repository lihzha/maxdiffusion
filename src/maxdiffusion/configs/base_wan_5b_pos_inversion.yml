# Wan2.2 TI2V 5B side-adapter training on cached DROID latent windows.

run_name: ''

metrics_file: ""
write_metrics: True
timing_metrics_file: ""
write_timing_metrics: True
gcs_metrics: False
save_config_to_gcs: False
log_period: 10
wandb_project: ''
wandb_entity: ''

pretrained_model_name_or_path: 'Wan-AI/Wan2.2-TI2V-5B-Diffusers'
model_name: wan2.2
model_type: 'SIDE_ADAPTER_TI2V'
wan_transformer_pretrained_model_name_or_path: ''
unet_checkpoint: ''
revision: ''
from_pt: True

weights_dtype: 'bfloat16'
activations_dtype: 'bfloat16'
precision: "DEFAULT"
scan_layers: False
jit_initializers: True
split_head_dim: True

replicate_vae: False
attention: 'flash'
use_memory_efficient_attention: False
flash_min_seq_length: 4096
flash_block_sizes: {}
norm_num_groups: 32
dropout: 0.0
mask_padding_tokens: True
attention_sharding_uniform: True

train_text_encoder: False
text_encoder_learning_rate: 0.0
snr_gamma: -1.0

timestep_bias: {
  strategy: "none",
  multiplier: 1.0,
  begin: 0,
  end: 1000,
  portion: 0.25
}

base_output_directory: ""
hardware: 'tpu'
skip_jax_distributed_system: False

mesh_axes: ['data', 'fsdp', 'context', 'tensor']
logical_axis_rules: [
                      ['batch', ['data', 'fsdp']],
                      ['activation_batch', ['data', 'fsdp']],
                      ['activation_self_attn_heads', ['context', 'tensor']],
                      ['activation_cross_attn_q_length', ['context', 'tensor']],
                      ['activation_length', 'context'],
                      ['activation_heads', 'tensor'],
                      ['mlp', 'tensor'],
                      ['embed', ['context', 'fsdp']],
                      ['heads', 'tensor'],
                      ['norm', 'tensor'],
                      ['conv_batch', ['data', 'context', 'fsdp']],
                      ['out_channels', 'tensor'],
                      ['conv_out', 'context'],
                    ]
vae_logical_axis_rules: [
                          ['activation_batch', 'redundant'],
                          ['activation_length', 'vae_spatial'],
                          ['activation_heads', null],
                          ['activation_kv_length', null],
                          ['embed', null],
                          ['heads', null],
                          ['norm', null],
                          ['conv_batch', 'redundant'],
                          ['out_channels', 'vae_spatial'],
                          ['conv_out', 'vae_spatial'],
                          ['conv_in', 'vae_spatial'],
                        ]
data_sharding: [['data', 'fsdp', 'context', 'tensor']]

dcn_data_parallelism: 1
dcn_fsdp_parallelism: -1
dcn_context_parallelism: 1
dcn_tensor_parallelism: 1
ici_data_parallelism: 1
ici_fsdp_parallelism: -1
ici_context_parallelism: 1
ici_tensor_parallelism: 1
allow_split_physical_axes: False

# Dataset. Conversion writes these exact window-level fields:
# z_i0    float16 [48, 1, 12, 20]
# z_video float16 [48, 9, 12, 20]
# actions float32 [32, 7]
dataset_name: ''
train_split: 'train'
dataset_type: 'tfrecord'
cache_latents_text_encoder_outputs: True
dataset_save_location: ''
load_tfrecord_cached: False
train_data_dir: 'gs://v6_east1d/datasets/droid_wan_side_adapter/train'
eval_data_dir: 'gs://v6_east1d/datasets/droid_wan_side_adapter/val'
dataset_config_name: ''
jax_cache_dir: ''
hf_data_dir: ''
hf_train_files: ''
hf_access_token: ''
image_column: 'image'
caption_column: 'text'
enable_data_shuffling: True
tfrecord_shuffle_buffer_size: -1
reuse_example_batch: False

# Wan2.2 TI2V 5B architecture. The loader reads the detailed transformer config
# from the pretrained diffusers checkpoint; these values keep config-derived
# helper shapes aligned with Wan2.2 2.2 latents.
in_channels: 48
out_channels: 48
text_dim: 4096
freq_dim: 256
ffn_dim: 13824
num_layers: 40
num_attention_heads: 40
attention_head_dim: 128

# Cached DROID latent window geometry: 33 raw frames -> 9 latent frames.
latent_channels: 48
latent_frames: 9
latent_height: 12
latent_width: 20
height: 192
width: 320
num_frames: 32
wan_max_sequence_length: 512

# Side adapter. Defaults match ../Wan2.2 distributed DROID side-adapter run.
action_adapter_type: 'side_adapter'
action_dim: 7
action_len: 32
action_repr: 'delta'
action_tokens: 8
action_hidden: 512
action_heads: 4
side_adapter_layers: '0-29'
side_adapter_hidden: 512
side_adapter_heads: 8
pre_context_tokens: 8
pre_context_heads: 8
side_adapter_sampling_steps: 25
side_adapter_noise_mode: 'fresh'
side_adapter_t_sampling: 'uniform'
side_adapter_logit_normal_mu: 0.0
side_adapter_logit_normal_sigma: 1.0
side_adapter_guide_scale: 5.0
flow_shift: 5.0
flow_sigma_min: 0.0
flow_sigma_max: 1.0

# Training loop.
learning_rate: 5.e-5
scale_lr: False
max_train_samples: -1
max_train_steps: 10000
num_train_epochs: 1
seed: 0
output_dir: 'gs://v6_east1d/checkpoints/maxdiffusion/wan-ti2v-side-adapter'
per_device_batch_size: 1.0
global_batch_size: 0
global_batch_size_to_train_on: 1
global_batch_size_to_load: 1

warmup_steps_fraction: 0.05
learning_rate_schedule_steps: -1
save_optimizer: True

adam_b1: 0.9
adam_b2: 0.999
adam_eps: 1.e-8
adam_weight_decay: 1.e-2
opt_enable_grad_clipping: False
max_grad_value: 1.0
opt_enable_grad_global_norm_clipping: True
max_grad_norm: 1.0
disable_training_weights: True

remat_policy: "FULL"
names_which_can_be_saved: []
names_which_can_be_offloaded: []

checkpoint_every: 1000
checkpoint_dir: ""
checkpoint_step: -1
checkpoint_keep_period: 5000
enable_single_replica_ckpt_restoring: False
save_final_checkpoint: True

eval_every: 1000
eval_max_batches: 4

enable_profiler: False
skip_first_n_steps_for_profiler: 5
profiler_steps: 10
enable_jax_named_scopes: False

# Inference/config compatibility fields.
num_eval_videos: 1
validation_output_dir: ''
validation_start_index: 0
validation_seed: 0
min_guidance_scale: 1.0
max_guidance_scale: 2.5
guidance_scale: 5.0
guidance_rescale: 0.0
num_inference_steps: 25
fps: 16
fps_id: 6
motion_bucket_id: 127
cond_aug: 0.02
decode_chunk_size: 8
vae_scale_factor: 0.18215
vae_scaling_factor: 0.18215
image_url: ''
prompt: ''
prompt_2: ''
negative_prompt: ''
do_classifier_free_guidance: True
image_encoder_pretrained_model_name_or_path: ''
lightning_from_pt: False
lightning_repo: ""
lightning_ckpt: ""
enable_lora: False
lora_config: {
  rank: [],
  lora_model_name_or_path: [],
  weight_name: [],
  adapter_name: [],
  scale: [],
  from_pt: []
}

enable_mllog: False
quantization: ''
quantization_local_shard_count: -1
compile_topology_num_slices: -1
use_qwix_quantization: False
weight_quantization_calibration_method: "absmax"
act_quantization_calibration_method: "absmax"
bwd_quantization_calibration_method: "absmax"
qwix_module_path: ".*"

enable_generate_video_for_eval: False
enable_ssim: False
enable_ml_diagnostics: False
profiler_gcs_path: ""
enable_ondemand_xprof: False

# ---------------------------------------------------------------------------
# exp_04 null-text inversion (plan §5.6). Every key must exist here to be
# overridable on the command line -- pyconfig coerces overrides to the YAML
# key's type and rejects unknown keys.
# ---------------------------------------------------------------------------
null_mode: 'capacity'              # capacity | cache | verify_replay | adequacy_probe
null_L: 16                         # L_null: how many T5("") rows the optimized nulls replace
null_inner_iters: 10               # J: Adam steps per sampler step (plan §3 default)
null_lr: 0.01                      # inner-loop Adam learning rate
null_guide_scale: 5.0              # deployment CFG weight w for optimization and replay
inversion_guide_scale: 1.0         # inversion runs at w=1: the null branch cancels out
null_noise_convention: 'keyed'     # keyed | global -- fixes the k-set (plan §3)
null_batch_size: 8                 # examples per batched arm call
null_pixel_convention: 'unit'      # what decode_fn emits: unit [0,1] | signed [-1,1] | byte [0,255]

null_manifest_dir: ''              # the published J0 manifest set (header + four cohorts)
null_cohort: 'dev64'               # which cohort this run works on
null_artifact_dir: ''              # published shards / tables / videos land here
null_staging_dir: ''               # attempt staging for the shard writer (R8)
null_data_dir: ''                  # TFRecord shards the manifest names live in

null_arms: 'a0,a1,a1_probe,a2,a2_0,a2_probe'   # which arms the capacity mode runs
null_eval_seed: 2026               # the experiment's fixed evaluation seed
null_decode_subset: 8              # how many examples get decoded videos
null_decode_batch_size: 8          # examples per VAE decode call; the cohort decode is bounded
null_fidelity_subset: 8            # the predeclared fp16 fidelity subset (plan §4-P2)
null_latent_dtype: 'fp16'          # storage dtype; the fidelity gate may flip it to fp32
null_adequacy_grid: '10:0.01,25:0.01,50:0.01,10:0.03,25:0.03,50:0.03'  # J:lr cells
null_min_free_bytes: 107374182400  # 100 GiB free-space floor before any write (SOP guardrail)
null_verify_atol: 0.01             # verify_replay tolerance for fp16 records
null_smoke_examples: 0             # J1 rung 1: truncate the DECLARED cohort to N examples (0 = off)
null_selection_uri: ''             # the J1 selection artifact cache/verify read their arm from
null_adequacy_uri: ''              # the adequacy artifact capacity adopts its recipe from

# ---------------------------------------------------------------------------
# exp_05 positive-context inversion (plan §5 items 2-3; round S4).
#
# This file is a COPY of base_wan_5b_null_inversion.yml plus the keys below;
# the null YAML is left untouched, so exp_04's launches are unaffected. Every
# key must exist here to be overridable on the command line -- pyconfig coerces
# overrides to the YAML key's type and rejects undeclared keys, which is also
# why `embedding_slot` cannot simply be passed on the CLI of the null config.
# ---------------------------------------------------------------------------
embedding_slot: 'positive'         # null | positive -- routes the modes (default elsewhere: null)
pos_L: 8                           # L_pos: rows of the deployed conditional context (plan §11 dec. 1)
pos_ablation_L: '1,8'              # the DIAGNOSTIC-only L_pos ablation; publication stays at pos_L

# Slot-isolated artifact roots: a positive run must never write into, or read a
# decision from, the null slot's tree (S4 review, finding 3).
pos_artifact_dir: ''               # published B-arm shards / tables / report land here
pos_staging_dir: ''                # attempt staging for the positive shard writer
pos_selection_uri: ''              # the K1 selection artifact the cache/verify modes read
pos_adequacy_uri: ''               # the positive adequacy artifact capacity adopts its recipe from
