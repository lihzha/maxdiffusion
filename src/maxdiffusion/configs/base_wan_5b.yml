# This sentinel is a reminder to choose a real run name.
run_name: ''

metrics_file: "" # for testing, local file that stores scalar metrics. If empty, no metrics are written.
# If true save metrics such as loss and TFLOPS to GCS in {base_output_directory}/{run_name}/metrics/
write_metrics: True

timing_metrics_file: "" # for testing, local file that stores function timing metrics such as state creation, compilation. If empty, no metrics are written.
write_timing_metrics: True

gcs_metrics: False
# If true save config to GCS in {base_output_directory}/{run_name}/
save_config_to_gcs: False
log_period: 50
wandb_project: ''   # set to enable W&B logging (e.g. 'wan-ti2v')
wandb_entity: ''    # W&B team/user; empty = personal account

pretrained_model_name_or_path: 'Wan-AI/Wan2.2-TI2V-5B-Diffusers'
model_name: wan2.2
model_type: 'TI2V'
# num_privileged_frames clean frames of future context (beyond the frame-0 anchor).
# Training: n_hist = num_privileged_frames + 1 (frame 0 is always clean).
# Inference: same value controls how many oracle future frames are prepended.

# distill: true  — on-policy rollout loss against GT velocity.
# distill: false — standard off-policy flow-matching loss.
distill: false
# Number of Euler steps in the on-policy generation rollout (distill=true only).
# The student denoises from T_max for k ~ Uniform[0, num_online_gen_steps) steps;
# the stopping timestep becomes the training timestep t for that batch element.
# -1 = use T_max (full rollout, i.e. num_train_timesteps - 1 steps).
num_online_gen_steps: -1

# Gradient mode for distill=true:
#   false — per-step gradients: each on-policy rollout state is an independent
#           training example; the rollout itself is not differentiated through.
#   true  — exact BPTT: the Euler rollout runs inside the loss, so each step's
#           velocity loss backpropagates through all earlier steps (pathwise
#           credit assignment through the dynamics). Transformer activations
#           are rematerialized (same FLOPs as per-step mode); the K-step
#           latent trajectory is stored, so keep num_online_gen_steps modest.
distill_bptt: false

# Classifier-free guidance training: per-sample probability of replacing the
# text embedding with the empty-prompt ("") UMT5 embedding during training.
# 0.0 disables. 0.1 is the standard choice; required for guidance_scale > 1
# at inference to be meaningful on a fine-tuned model.
cfg_dropout_prob: 0.0

# Overrides the transformer from pretrained_model_name_or_path
wan_transformer_pretrained_model_name_or_path: ''

unet_checkpoint: ''
revision: ''
# This will convert the weights to this dtype.
# When running inference on TPUv5e, use weights_dtype: 'bfloat16'
weights_dtype: 'bfloat16'
# This sets the layer's dtype in the model. Ex: nn.Dense(dtype=activations_dtype)
activations_dtype: 'bfloat16'

# Replicates vae across devices instead of using the model's sharding annotations for sharding.
replicate_vae: False

# matmul and conv precision from https://jax.readthedocs.io/en/latest/jax.lax.html#jax.lax.Precision
# Options are "DEFAULT", "HIGH", "HIGHEST"
# fp32 activations and fp32 weights with HIGHEST will provide the best precision
# at the cost of time.
precision: "DEFAULT"
# Use jax.lax.scan for transformer layers
scan_layers: True

# if False state is not jitted and instead replicate is called. This is good for debugging on single host
# It must be True for multi-host.
jit_initializers: True

# Set true to load weights from pytorch
from_pt: True
split_head_dim: True
attention: 'cudnn_flash_te' # Supported attention: dot_product, flash, cudnn_flash_te, ring, ulysses
flash_min_seq_length: 0

# If mask_padding_tokens is True, we pass in segment ids to splash attention to avoid attending to padding tokens.
# Else we do not pass in segment ids and on vpu bound hardware like trillium this is faster.
# However, when padding tokens are significant, this will lead to worse quality and should be set to True.
mask_padding_tokens: True
# Maxdiffusion has 2 types of attention sharding strategies:
# 1. attention_sharding_uniform = True : same sequence sharding rules applied for q in both (self and cross attention)
# 2. attention_sharding_uniform = False : Heads are sharded uniformly across devices for self attention while sequence is sharded
#    in cross attention q.
attention_sharding_uniform: True
dropout: 0.0

flash_block_sizes: {
  "block_q" : 512,
  "block_kv_compute" : 512,
  "block_kv" : 512,
  "block_q_dkv" : 512,
  "block_kv_dkv" : 512,
  "block_kv_dkv_compute" : 512,
  "block_q_dq" : 512,
  "block_kv_dq" : 512,
  "use_fused_bwd_kernel": False,
}
# GroupNorm groups
norm_num_groups: 32

# train text_encoder - Currently not supported for SDXL
train_text_encoder: False
text_encoder_learning_rate: 4.25e-6

# https://arxiv.org/pdf/2305.08891.pdf
snr_gamma: -1.0

timestep_bias: {
  # a value of later will increase the frequence of the model's final training steps.
  # none, earlier, later, range
  strategy: "none",
  # multiplier for bias, a value of 2.0 will double the weight of the bias, 0.5 will halve it.
  multiplier: 1.0,
  # when using strategy=range, the beginning (inclusive) timestep to bias.
  begin: 0,
  # when using strategy=range, the final step (inclusive) to bias.
  end: 1000,
  # portion of timesteps to bias.
  # 0.5 will bias one half of the timesteps. Value of strategy determines
  # whether the biased portions are in the earlier or later timesteps.
  portion: 0.25
}

# Override parameters from checkpoints's scheduler.
diffusion_scheduler_config: {
  _class_name: 'FlaxEulerDiscreteScheduler',
  prediction_type: 'epsilon',
  rescale_zero_terminal_snr: False,
  timestep_spacing: 'trailing'
}

# Output directory
# Create a GCS bucket, e.g. my-maxtext-outputs and set this to "gs://my-maxtext-outputs/"
base_output_directory: ""

# Hardware
hardware: 'gpu' # Supported hardware types are 'tpu', 'gpu'
skip_jax_distributed_system: False

# Parallelism
mesh_axes: ['data', 'fsdp', 'context', 'tensor']

# batch : batch dimension of data and activations
# hidden :
# embed : attention qkv dense layer hidden dim named as embed
# heads : attention head dim = num_heads * head_dim
# length : attention sequence length
# temb_in : dense.shape[0] of resnet dense before conv
# out_c : dense.shape[1] of resnet dense before conv
# out_channels : conv.shape[-1] activation
# keep_1 : conv.shape[0] weight
# keep_2 : conv.shape[1] weight
# conv_in : conv.shape[2] weight
# conv_out : conv.shape[-1] weight
logical_axis_rules: [
                      ['batch', ['data', 'fsdp']],
                      ['activation_batch', ['data', 'fsdp']],
                      ['activation_self_attn_heads', ['context', 'tensor']],
                      ['activation_cross_attn_q_length', ['context', 'tensor']],
                      ['activation_length', 'context'],
                      ['activation_heads', 'tensor'],
                      ['mlp','tensor'],
                      ['embed', ['context', 'fsdp']],
                      ['heads', 'tensor'],
                      ['norm', 'tensor'],
                      ['conv_batch', ['data', 'context', 'fsdp']],
                      ['out_channels', 'tensor'],
                      ['conv_out', 'context'],
                    ]
vae_logical_axis_rules: [
                          ['activation_batch', 'redundant'],
                          ['activation_length', 'vae_spatial'],
                          ['activation_heads', null],
                          ['activation_kv_length', null],
                          ['embed', null],
                          ['heads', null],
                          ['norm', null],
                          ['conv_batch', 'redundant'],
                          ['out_channels', 'vae_spatial'],
                          ['conv_out', 'vae_spatial'],
                          ['conv_in', 'vae_spatial'],
                        ]
data_sharding: [['data', 'fsdp', 'context', 'tensor']]

# One axis for each parallelism type may hold a placeholder (-1)
# value to auto-shard based on available slices and devices.
# By default, product of the DCN axes should equal number of slices
# and product of the ICI axes should equal number of devices per slice.
dcn_data_parallelism: 1  # recommended DCN axis to be auto-sharded
dcn_fsdp_parallelism: 1
dcn_context_parallelism: -1
dcn_tensor_parallelism: 1
ici_data_parallelism: 1
ici_fsdp_parallelism: 1
ici_context_parallelism: -1  # recommended ICI axis to be auto-sharded
ici_tensor_parallelism: 1

allow_split_physical_axes: False

# Dataset
# Replace with dataset path or train_data_dir. One has to be set.
dataset_name: 'diffusers/pokemon-gpt4-captions'
train_split: 'train'
dataset_type: 'tfrecord'
# When True, each training sample uses one randomly-chosen camera view instead of
# concatenating all three along H.  Eval always uses cam0 (wrist).
single_camera: False
cache_latents_text_encoder_outputs: True
# cache_latents_text_encoder_outputs only apply to dataset_type="tf",
# only apply to small dataset that fits in memory
# prepare image latents and text encoder outputs
# Reduce memory consumption and reduce step time during training
# transformed dataset is saved at dataset_save_location
dataset_save_location: ''
load_tfrecord_cached: True
train_data_dir: ''
dataset_config_name: ''
jax_cache_dir: ''
hf_data_dir: ''
hf_train_files: ''
hf_access_token: ''
image_column: 'image'
caption_column: 'text'
resolution: 1024
center_crop: False
random_flip: False
# If cache_latents_text_encoder_outputs is True
# the num_proc is set to 1
tokenize_captions_num_proc: 4
transform_images_num_proc: 4
reuse_example_batch: False
enable_data_shuffling: True

# Defines the type of gradient checkpoint to enable.
# NONE - means no gradient checkpoint
# FULL - means full gradient checkpoint, whenever possible (minimum memory usage)
# MATMUL_WITHOUT_BATCH - means gradient checkpoint for every linear/matmul operation,
# except for ones that involve batch dimension - that means that all attention and projection
# layers will have gradient checkpoint, but not the backward with respect to the parameters.
# OFFLOAD_MATMUL_WITHOUT_BATCH - same as MATMUL_WITHOUT_BATCH but offload instead of recomputing.
# CUSTOM - set names to offload and save.
remat_policy: "MATMUL_WITHOUT_BATCH"
# For CUSTOM policy set below, current annotations are for: attn_output, query_proj, key_proj, value_proj
# xq_out, xk_out, ffn_activation
names_which_can_be_saved: []
names_which_can_be_offloaded: []

# checkpoint every number of samples, -1 means don't checkpoint.
checkpoint_every: -1
# Keep every Nth checkpoint permanently regardless of max_to_keep. -1 = disabled.
checkpoint_keep_period: -1
checkpoint_dir: ""
# Specific checkpoint step to load for inference. -1 = latest.
checkpoint_step: -1
# enables one replica to read the ckpt then broadcast to the rest
enable_single_replica_ckpt_restoring: False

# Training loop
learning_rate: 1.e-5
scale_lr: False
max_train_samples: -1
# max_train_steps takes priority over num_train_epochs.
max_train_steps: 1500
num_train_epochs: 1
seed: 0
output_dir: 'wan-ctrl-world-output'
per_device_batch_size: 1.0
# If global_batch_size % jax.device_count is not 0, use FSDP sharding.
global_batch_size: 0
disable_training_weights: True # if True, disables the use of mid-point loss weighting

# For creating tfrecords from dataset
tfrecords_dir: ''
no_records_per_shard: 0
enable_eval_timesteps: False
timesteps_list: [125, 250, 375, 500, 625, 750, 875]
num_eval_samples: 1

warmup_steps_fraction: 0.1
learning_rate_schedule_steps: -1 # By default the length of the schedule is set to the number of steps.
save_optimizer: True

# However you may choose a longer schedule (learning_rate_schedule_steps > steps), in which case the training will end before
# dropping fully down. Or you may choose a shorter schedule, where the unspecified steps will have a learning rate of 0.

# AdamW optimizer parameters
adam_b1: 0.9 # Exponential decay rate to track the first moment of past gradients.
adam_b2: 0.999 # Exponential decay rate to track the second moment of past gradients.
adam_eps: 1.e-8 # A small constant applied to denominator outside of the square root.
adam_weight_decay: 0.0 # AdamW Weight decay
opt_enable_grad_clipping: False
max_grad_value: 1.0
opt_enable_grad_global_norm_clipping: False
max_grad_norm: 1.0

enable_profiler: False
# Skip first n steps for profiling, to omit things like compilation and to give
# the iteration time a chance to stabilize.
skip_first_n_steps_for_profiler: 5
profiler_steps: 10

# Enable JAX named scopes for detailed profiling and debugging
# When enabled, adds named scopes around key operations in transformer and attention layers
enable_jax_named_scopes: False

# Generation parameters
prompt: "The robot arm reaches toward the orange plastic cup, grasps it with a parallel gripper, lifts it, and carefully pours out the contents onto the black serving tray. The arm performs precise pick-and-place style manipulation with realistic robot kinematics, no camera shake, natural lighting, and physics-consistent object interactions. The scene has the look of a real-world robotics imitation-learning dataset collected in a research lab, with continuous smooth motion, high temporal consistency, and detailed tabletop clutter. An example of a valid video is given."
prompt_2: "The robot arm reaches toward the orange plastic cup, grasps it with a parallel gripper, lifts it, and carefully pours out the contents onto the black serving tray. The arm performs precise pick-and-place style manipulation with realistic robot kinematics, no camera shake, natural lighting, and physics-consistent object interactions. The scene has the look of a real-world robotics imitation-learning dataset collected in a research lab, with continuous smooth motion, high temporal consistency, and detailed tabletop clutter. An example of a valid video is given."
negative_prompt: "Bright tones, overexposed, static, blurred details, subtitles, style, works, paintings, images, static, overall gray, worst quality, low quality, JPEG compression residue, ugly, incomplete, extra fingers, poorly drawn hands, poorly drawn faces, deformed, disfigured, misshapen limbs, fused fingers, still picture, messy background, three legs, many people in the background, walking backwards"
do_classifier_free_guidance: True
height: 704
width: 1280
num_frames: 80
guidance_scale: 5.0
flow_shift: 5.0

# Input image URL for TI2V conditioning (first frame anchor)
image_url: "model/Wan2.2-TI2V-5B-Diffusers/examples/i2v_input.JPG"
# Path to conditioning video for privileged future-frame conditioning. Empty string disables it.
conditioning_video: "" #"test_droid_inference.mp4"
# Directory containing val TFRecords (same format as training: latent_cam0/1/2 + text_embed).
# When set, bypasses image_url/conditioning_video and loads pre-encoded latents directly.
val_data_dir: ""
# Which sample index to use from the val dataset (0-indexed).
val_sample_index: 0

# Diffusion CFG cache (FasterCache-style)
use_cfg_cache: False

# Sensitivity-Aware Cache (arXiv:2602.24208)
use_sen_cache: False

# Privileged future-frame conditioning (set conditioning_video in __call__).
# -1 = use all frames from the conditioning video as context.
# >0 = use at most this many clean future frames prepended to the DiT input.
num_privileged_frames: -1
# Timestep offset applied to oracle frames during inference: oracle latents are noised
# to t - oracle_noise_offset using the flow-matching forward process, and their
# per-token timestep is set to max(0, t - oracle_noise_offset). -1 = clean (no noise).
oracle_noise_offset: -1

# Fraction of denoising steps to run without oracle before injecting privileged frames.
# 0.0 = full oracle from step 0; 1.0 = never inject (no oracle). Used by generate_wan_late_oracle.py.
t_switch_frac: 0.5
# Maximum number of val samples to process (-1 = all). Used by generate_wan_late_oracle.py.
max_samples: -1

# Based on 3.4. in https://arxiv.org/pdf/2305.08891.pdf
guidance_rescale: 0.0
num_inference_steps: 30
fps: 16
save_final_checkpoint: False
use_gt_velocity: False

# SDXL Lightning parameters
lightning_from_pt: True
# Empty or "ByteDance/SDXL-Lightning" to enable lightning.
lightning_repo: ""
# Empty or "sdxl_lightning_4step_unet.safetensors" to enable lightning.
lightning_ckpt: ""

# LoRA parameters
enable_lora: False
# Values are lists to support multiple LoRA loading during inference in the future.
lora_config: {
  rank: [64],
  lora_model_name_or_path: [""],
  weight_name: [""],
  adapter_name: [""],
  scale: [1.0],
  from_pt: []
}

enable_mllog: False

#controlnet
controlnet_model_name_or_path: 'diffusers/controlnet-canny-sdxl-1.0'
controlnet_from_pt: True
controlnet_conditioning_scale: 0.5
controlnet_image: 'https://upload.wikimedia.org/wikipedia/commons/thumb/c/c1/Google_%22G%22_logo.svg/1024px-Google_%22G%22_logo.svg.png'
quantization: ''
# Shard the range finding operation for quantization. By default this is set to number of slices.
quantization_local_shard_count: -1
compile_topology_num_slices: -1 # Number of target slices, set to a positive integer.
use_qwix_quantization: False # Whether to use qwix for quantization. If set to True, the transformer of WAN will be quantized using qwix.
# Quantization calibration method used for weights, activations and bwd. Supported methods can be found in https://github.com/google/qwix/blob/dc2a0770351c740e5ab3cce7c0efe9f7beacce9e/qwix/qconfig.py#L70-L80
weight_quantization_calibration_method: "absmax"
act_quantization_calibration_method: "absmax"
bwd_quantization_calibration_method: "absmax"
qwix_module_path: ".*"

# Eval model on per eval_every steps. -1 means don't eval.
eval_every: -1
eval_data_dir: ""
enable_generate_video_for_eval: False # This will increase the used TPU memory.
eval_max_number_of_samples_in_bucket: 60 # The number of samples per bucket for evaluation. This is calculated by num_eval_samples / len(timesteps_list).

enable_ssim: False

# ML Diagnostics settings
enable_ml_diagnostics: False
profiler_gcs_path: ""
enable_ondemand_xprof: False
