# Stable Video Diffusion (base) inference on a single NVIDIA GPU.
#
# Usage:
#   source .venv/bin/activate
#   JAX_PLATFORMS=cuda,cpu XLA_PYTHON_CLIENT_PREALLOCATE=false \
#     python -m maxdiffusion.generate_svd src/maxdiffusion/configs/base_svd_gpu.yml
#
# Override at the CLI, e.g.: motion_bucket_id=180 num_inference_steps=25 seed=0
#
# Note: SVD has no text input. The `prompt` field from `base_svd.yml` is
# carried for pyconfig compat but ignored by the pipeline. Motion is
# controlled by `motion_bucket_id` (higher = more motion; default 127).

run_name: ''

metrics_file: ""
write_metrics: False
timing_metrics_file: ""
write_timing_metrics: False
gcs_metrics: False
save_config_to_gcs: False
log_period: 100

pretrained_model_name_or_path: 'stabilityai/stable-video-diffusion-img2vid'
model_name: svd
model_type: 'I2V'

unet_checkpoint: ''
revision: ''
# UNet / VAE / image_encoder are all converted on the fly from PyTorch.
from_pt: True

weights_dtype: 'bfloat16'
activations_dtype: 'bfloat16'

replicate_vae: False
precision: "DEFAULT"
scan_layers: True
jit_initializers: True
split_head_dim: True

# GPU path: dot_product on both branches. Switch to cudnn_flash_te once
# transformer_engine[jax] is installed (see docs/dgx_spark.md for the env vars).
attention: 'dot_product'
temporal_attention: 'dot_product'
# Chunked-query attention (routes `dot_product` through
# jax_memory_efficient_attention). Avoids materializing the full N×N scores
# matrix at the shallowest spatial stage — the difference between OOM and
# fitting 512×512 on a 24 GB GPU with T=14 frames. Small perf hit (<5%
# from the extra scan + checkpoint). Safe to leave on at all resolutions.
use_memory_efficient_attention: True
flash_min_seq_length: 4096
dropout: 0.0

mask_padding_tokens: True
attention_sharding_uniform: True

# Empty on GPU (flash_block_sizes is TPU-SplashAttention-only).
flash_block_sizes: {}

norm_num_groups: 32

train_text_encoder: False
text_encoder_learning_rate: 0.0

snr_gamma: -1.0

timestep_bias: {
  strategy: "none",
  multiplier: 1.0,
  begin: 0,
  end: 1000,
  portion: 0.25
}

diffusion_scheduler_config: {
  prediction_type: 'v_prediction',
  sigma_min: 0.002,
  sigma_max: 700.0,
  rho: 7.0,
  timestep_spacing: 'edm'
}

base_output_directory: ""

# -------- Hardware --------
hardware: 'gpu'
# Single-GPU single-host: no distributed bootstrap.
skip_jax_distributed_system: True

# -------- Parallelism (single-GPU 1x1x1x1 mesh) --------
mesh_axes: ['data', 'fsdp', 'context', 'tensor']

logical_axis_rules: [
                      ['batch', ['data', 'fsdp']],
                      ['activation_batch', ['data', 'fsdp']],
                      ['activation_self_attn_heads', ['context', 'tensor']],
                      ['activation_cross_attn_q_length', ['context', 'tensor']],
                      ['activation_length', 'context'],
                      ['activation_heads', 'tensor'],
                      ['mlp', 'tensor'],
                      ['embed', ['context', 'fsdp']],
                      ['heads', 'tensor'],
                      ['norm', 'tensor'],
                      ['conv_batch', ['data', 'context', 'fsdp']],
                      ['out_channels', 'tensor'],
                      ['conv_out', 'context'],
                    ]
vae_logical_axis_rules: [
                          ['activation_batch', 'redundant'],
                          ['activation_length', 'vae_spatial'],
                          ['activation_heads', null],
                          ['activation_kv_length', null],
                          ['embed', null],
                          ['heads', null],
                          ['norm', null],
                          ['conv_batch', 'redundant'],
                          ['out_channels', 'vae_spatial'],
                          ['conv_out', 'vae_spatial'],
                          ['conv_in', 'vae_spatial'],
                        ]
data_sharding: [['data', 'fsdp', 'context', 'tensor']]

dcn_data_parallelism: 1
dcn_fsdp_parallelism: 1
dcn_context_parallelism: 1
dcn_tensor_parallelism: 1
ici_data_parallelism: 1
ici_fsdp_parallelism: 1
ici_context_parallelism: 1
ici_tensor_parallelism: 1

allow_split_physical_axes: False

# -------- Dataset fields (unused for inference) --------
dataset_name: ''
train_split: 'train'
dataset_type: 'tfrecord'
cache_latents_text_encoder_outputs: False
dataset_save_location: ''
load_tfrecord_cached: False
train_data_dir: ''
dataset_config_name: ''
# Persistent jax cache disabled — same LegacyGpuAotCompilationResult
# serializer bug we hit with SD 1.4 on this jax/jaxlib combo.
jax_cache_dir: ''
hf_data_dir: ''
hf_train_files: ''
hf_access_token: ''
image_column: 'image'
caption_column: 'text'
resolution: 1024
center_crop: False
random_flip: False
tokenize_captions_num_proc: 4
transform_images_num_proc: 4
reuse_example_batch: False
enable_data_shuffling: True

# Remat is mandatory at SVD's resolution on a 24GB GPU.
remat_policy: "MATMUL_WITHOUT_BATCH"
names_which_can_be_saved: []
names_which_can_be_offloaded: []

checkpoint_every: -1
checkpoint_dir: ""
enable_single_replica_ckpt_restoring: False

learning_rate: 1.e-5
scale_lr: False
max_train_samples: -1
max_train_steps: 1500
num_train_epochs: 1
seed: 23
output_dir: '/tmp/svd_gpu_out'
per_device_batch_size: 1.0
global_batch_size: 0

tfrecords_dir: ''
no_records_per_shard: 0
enable_eval_timesteps: False
timesteps_list: []
num_eval_samples: 0

warmup_steps_fraction: 0.1
learning_rate_schedule_steps: -1
save_optimizer: False

adam_b1: 0.9
adam_b2: 0.999
adam_eps: 1.e-8
adam_weight_decay: 0.0
opt_enable_grad_clipping: False
max_grad_value: 1.0
opt_enable_grad_global_norm_clipping: False
max_grad_norm: 1.0

enable_profiler: False
skip_first_n_steps_for_profiler: 5
profiler_steps: 10

enable_jax_named_scopes: False

# -------- SVD generation parameters --------
# Local image generated by the SD 1.4 smoke test (base14_gpu.yml).
image_url: "/home/irom-lab/projects/generative-models/outputs/svd_puppy/000000.jpg"

# prompt is ignored by SVD (no text encoder); kept for pyconfig compat.
prompt: "make the puppy run"
prompt_2: ""
negative_prompt: ""
do_classifier_free_guidance: True

# Match the 512x512 puppy input. SVD's _preprocess_image_for_vae resizes the
# input to (width, height) without preserving aspect ratio, so rectangular
# settings stretch square inputs. Keep height==width to preserve the input
# aspect; must be divisible by 8 (VAE scale factor). SVD was trained at
# 576x1024, so square sizes like 512/576 are slightly out-of-distribution
# but visually close.
height: 576
width: 1024
num_frames: 14

# Per-frame linear CFG ramp.
min_guidance_scale: 1.0
max_guidance_scale: 2.5
# Single scalar scale is unused for SVD (kept for pyconfig compat).
guidance_scale: 2.5
flow_shift: 0.0

guidance_rescale: 0.0
num_inference_steps: 25
# Output .mp4 frame rate. Only read by export_to_video in generate_svd.py;
# the UNet does NOT see this. Unrelated to `fps_id` below.
fps: 6
save_final_checkpoint: False

# SVD-specific micro-conditioning.
# `fps_id` is the value the UNet's ADM embedder actually reads (SGM convention,
# default 6 — matches sgm/scripts/sampling/simple_video_sample.py). Diffusers
# instead takes a user-facing `fps=7` and subtracts 1 internally to get
# `fps_id=6`; this port does NOT do that, so set fps_id directly.
fps_id: 6
# Motion strength bucket. 127 is the SGM default; higher buckets (e.g. 180)
# trade frame-0 fidelity for more inter-frame motion — see §4.1 in
# docs/svd_debug_notes.md.
motion_bucket_id: 127
# Noise strength added to the conditioning image latent before concat.
cond_aug: 0.02

# Number of frames to decode at once. Lower values reduce VAE decode peak
# memory at the cost of a small temporal discontinuity at chunk boundaries
# (the VAE temporal conv has kernel=3). Diffusers exposes the same knob as
# `decode_chunk_size`.
decode_chunk_size: 1

# Optional directory for debug dumps (VAE-preprocessed input + VAE round-trip
# of the conditioning image). Compare debug_vae_roundtrip_frame00.png to
# image_0.png: if they match, UNet/sampler is the bug; if not, VAE path is.
debug_dir: ''

# VAE latent scale (SD-1.x, not SDXL).
vae_scale_factor: 0.18215

# CLIP image encoder: empty => <pretrained_model_name_or_path>/image_encoder.
image_encoder_pretrained_model_name_or_path: ''

# SDXL Lightning (unused).
lightning_from_pt: False
lightning_repo: ""
lightning_ckpt: ""

# LoRA (unused for SVD).
enable_lora: False
lora_config: {
  rank: [],
  lora_model_name_or_path: [],
  weight_name: [],
  adapter_name: [],
  scale: [],
  from_pt: []
}

enable_mllog: False

# Unused controlnet fields (kept for pyconfig compat).
controlnet_model_name_or_path: ''
controlnet_from_pt: False
controlnet_conditioning_scale: 0.0
controlnet_image: ''
quantization: ''
quantization_local_shard_count: -1
compile_topology_num_slices: -1
use_qwix_quantization: False
quantization_calibration_method: "absmax"
qwix_module_path: ".*"

eval_every: -1
eval_data_dir: ""
enable_generate_video_for_eval: False
eval_max_number_of_samples_in_bucket: 0

enable_ssim: False

enable_ml_diagnostics: False
profiler_gcs_path: ""
enable_ondemand_xprof: False
