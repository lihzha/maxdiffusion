# Base config for action-conditioned WAN 5B Ti2V (Ctrl-World style) training.
#
# Initialises from the WAN 2.2 Ti2V 5B diffusers checkpoint and adds a small
# NNX action encoder that maps per-frame robot actions into the cross-attention
# space. Action tokens are prepended to T5 text tokens before the WAN
# transformer's text projection — no changes to the transformer itself.
#
# Data: pre-encoded TFRecord shards (WAN VAE latents + T5 text tokens + actions).
# See docs/wan_ctrl_world_data_format.md.
#
#
# Usage:
# export XLA_PYTHON_CLIENT_MEM_FRACTION=.95
# export XLA_PYTHON_CLIENT_PREALLOCATE=false
# export NVTE_FUSED_ATTN=1
# export TF_GPU_ALLOCATOR=cuda_malloc_async
# export CUDA_VISIBLE_DEVICES=0,1
# python src/maxdiffusion/train_wan.py \
#     src/maxdiffusion/configs/base_wan_ctrl_world.yml \
#     run_name=test \
#     output_dir=wan-ctrl-world-output \
#     train_data_dir=droid_wan_tfrecords_test/train \
#     eval_data_dir=droid_wan_tfrecords_test/val

run_name: ''

metrics_file: ""
write_metrics: True
timing_metrics_file: ""
write_timing_metrics: True
gcs_metrics: False
save_config_to_gcs: False
log_period: 100
wandb_project: ''   # set to enable W&B logging (e.g. 'wan-ctrl-world')
wandb_entity: ''    # W&B team/user; empty = personal account

# W&B video logging: every N steps run an Euler rollout on one eval batch,
# decode generated vs ground-truth futures with the VAE, and log side-by-side
# videos (cameras stacked vertically, gen | GT horizontally). 0 = disabled.
# Requires wandb_project and eval_data_dir. Note: keeps the VAE decoder
# resident in device memory for the whole run (bf16, ~1.1 GB across the mesh;
# the encoder weights are dropped at startup).
wandb_video_every: 0
wandb_video_samples: 1           # eval samples to decode and log per video step
wandb_video_inference_steps: 20  # Euler denoising steps for the rollout
wandb_video_guidance_scale: 1.0  # >1.0 enables action CFG (doubles rollout compute)

# WAN 2.2 Ti2V 5B: source of UNet/transformer weights. The action encoder is
# always initialised from scratch (no pretrained action encoder assumed).
pretrained_model_name_or_path: 'model/Wan2.2-TI2V-5B-Diffusers'
model_name: wan2.2
model_type: 'AC_TI2V'

# Overrides the transformer from pretrained_model_name_or_path
wan_transformer_pretrained_model_name_or_path: ''

unet_checkpoint: ''
revision: ''

from_pt: True
# fp32 master weights + fp32 Adam moments (moments inherit the param dtype in
# create_optimizer). At lr=1e-5 a bf16 update (~1e-5) rounds away against bf16's
# ~2^-8 relative resolution for weights >~2.6e-3, so bf16 params barely update —
# fatal for the from-scratch action encoder. Compute stays bf16 via
# activations_dtype below (mixed precision).
weights_dtype: 'float32'
activations_dtype: 'bfloat16'
precision: "DEFAULT"
scan_layers: True
jit_initializers: True
split_head_dim: True

# Replicate VAE across devices instead of using the model's sharding annotations for sharding.
replicate_vae: False

attention: 'cudnn_flash_te'
use_memory_efficient_attention: False
flash_min_seq_length: 4096
flash_block_sizes: {}
norm_num_groups: 32
dropout: 0.0
mask_padding_tokens: True
attention_sharding_uniform: True

train_text_encoder: False
text_encoder_learning_rate: 0.0
snr_gamma: -1.0

timestep_bias: {
  strategy: "none",
  multiplier: 1.0,
  begin: 0,
  end: 1000,
  portion: 0.25
}

base_output_directory: ""
hardware: 'tpu'
skip_jax_distributed_system: False

mesh_axes: ['data', 'fsdp', 'context', 'tensor']
logical_axis_rules: [
                      ['batch', ['data', 'fsdp']],
                      ['activation_batch', ['data', 'fsdp']],
                      ['activation_self_attn_heads', ['context', 'tensor']],
                      ['activation_cross_attn_q_length', ['context', 'tensor']],
                      ['activation_length', 'context'],
                      ['activation_heads', 'tensor'],
                      ['mlp', 'tensor'],
                      ['embed', ['context', 'fsdp']],
                      ['heads', 'tensor'],
                      ['norm', 'tensor'],
                      ['conv_batch', ['data', 'context', 'fsdp']],
                      ['out_channels', 'tensor'],
                      ['conv_out', 'context'],
                    ]
vae_logical_axis_rules: [
                          ['activation_batch', 'redundant'],
                          ['activation_length', 'vae_spatial'],
                          ['activation_heads', null],
                          ['activation_kv_length', null],
                          ['embed', null],
                          ['heads', null],
                          ['norm', null],
                          ['conv_batch', 'redundant'],
                          ['out_channels', 'vae_spatial'],
                          ['conv_out', 'vae_spatial'],
                          ['conv_in', 'vae_spatial'],
                        ]
data_sharding: [['data', 'fsdp', 'context', 'tensor']]

dcn_data_parallelism: 1
dcn_fsdp_parallelism: 1
dcn_context_parallelism: -1
dcn_tensor_parallelism: 1
ici_data_parallelism: 1
ici_fsdp_parallelism: 1
ici_context_parallelism: -1
ici_tensor_parallelism: 1
allow_split_physical_axes: False

# ── Dataset ────────────────────────────────────────────────────────────────────
dataset_name: ''
train_split: 'train'
dataset_type: 'wan_ctrl_world'
cache_latents_text_encoder_outputs: True  # latents and T5 embeds are pre-encoded
dataset_save_location: ''
load_tfrecord_cached: False
train_data_dir: ''
eval_data_dir: ''
dataset_config_name: ''
jax_cache_dir: ''
hf_data_dir: ''
hf_train_files: ''
hf_access_token: ''
image_column: 'image'
caption_column: 'text'
enable_data_shuffling: True
reuse_example_batch: False

# ── WAN model architecture (must match pretrained checkpoint) ──────────────────
# WAN 2.2 Ti2V 5B architecture dims.
in_channels: 16
out_channels: 16
text_dim: 4096           # T5 encoder output dim
freq_dim: 256
ffn_dim: 13824
num_layers: 40
num_attention_heads: 40
attention_head_dim: 128  # inner_dim = 40 * 128 = 5120

# ── Action conditioning ────────────────────────────────────────────────────────
# Ctrl-World style: action tokens prepended to T5 text tokens in cross-attention.
# Action encoder: (B, T_act, action_dim) → (B, T_act, wan_text_dim=4096).

action_dim: 7             # cartesian (6) + gripper (1)
wan_text_dim: 4096        # must equal pretrained T5 output dim
wan_action_encoder_hidden_dim: 1024
# Cross-attention K/V tokens per latent frame. 1 = legacy: the 4 raw actions are
# concatenated into one token (softmax over a single key is constant, so the
# conditioning is a query-independent additive injection and the transformer's
# cross-attn Q/K weights receive no gradient). 4 = one token per raw action with
# a learned slot embedding; attention becomes content-dependent.
# NOTE: changing this changes the action-encoder architecture — checkpoints are
# not compatible across values.
action_tokens_per_latent_frame: 4

# How the action reaches the transformer:
#   'cross_attn' (default) — action tokens are the sole cross-attention K/V
#                             sequence (frame-locked via action_tokens_per_latent_frame).
#   'adaln'                — cross-attention gets zeroed (no-op) tokens instead;
#                             action tokens are projected per latent frame and
#                             summed into the per-token timestep embedding that
#                             drives AdaLN modulation.
#   'skeleton'             — the 7-dim vector actions are NOT used. Conditioning is
#                             a rendered 2D-kinematic-skeleton video, VAE-encoded
#                             into latents token-for-token aligned with the video
#                             latents, patch-embedded by their own conv and ADDED
#                             onto the video tokens. This is the OSCAR recipe.
#                             Requires a dataset with skeleton_cam* features (e.g.
#                             droid_wan_skeletal_192_320); the action encoder is
#                             not built, so action_dim / wan_action_encoder_hidden_dim
#                             / action_tokens_per_latent_frame stop mattering except
#                             for the zero cross-attn placeholder's sequence length.
#   'skeleton_adaln'       — the same skeleton latents as 'skeleton', but patch-
#                             embedded into per-token AdaLN conditioning instead of
#                             a video-token bias, so the signal re-modulates every
#                             block rather than being injected once after the patch
#                             embedding. Uses the SAME site as 'adaln' (summed into
#                             the per-token timestep embedding), so "adaln" names one
#                             site regardless of representation and a skeleton-vs-
#                             vector comparison is not confounded by the wiring.
#                             Needs no projection or spatial repeat — those exist in
#                             the vector route only because a 7-dim action has no
#                             spatial extent — since the per-token AdaLN grid (built
#                             for TI2V's per-token timesteps) already lines up
#                             token-for-token with the skeleton grid. Same dataset
#                             requirement as 'skeleton'. Ignores skeleton_embed_alpha.
#                             Caveat inherited from sharing the site, and SHARED
#                             with 'adaln' rather than specific to the skeleton: the
#                             signal lives in the same representation as the diffusion
#                             timestep and reaches scale/gate, not just shift. Only
#                             the perturbation's shape differs — a per-frame action
#                             constant is confusable with a timestep change, a spatial
#                             skeleton offset is separable but off-distribution for
#                             time_proj. Watch the modulation stats either way.
# The two axes here are independent in principle: an action REPRESENTATION (vector
# actions or rendered-skeleton latents) crossed with a conditioning SITE (cross-
# attention K/V, AdaLN modulation, additive in video-token space). The four modes
# above are four of those six cells; skeleton-into-cross-attention and vector-
# actions-as-additive are not implemented.
# NOTE: changing this is not checkpoint-compatible — each mode trains a different
# set of extra modules ('adaln' has action_adaln_proj, 'skeleton' has
# skeleton_embed, 'skeleton_adaln' has skeleton_adaln_embed, and both skeleton
# modes have no action_encoder at all).
action_cond_mode: 'cross_attn'

# ── Skeleton conditioning (action_cond_mode: 'skeleton') ───────────────────────
# Applies to 'skeleton' ONLY. 'skeleton_adaln' deliberately has no alpha: with a
# zero-init kernel the injection is exactly zero at step 0 either way, so all
# alpha still does is throttle that path's effective learning rate by alpha**2 —
# a hyperparameter in disguise. Setting this under 'skeleton_adaln' has no effect.
# Fixed scale on the skeleton tokens before they are added to the video tokens:
#     h = patch_embedding(video) + alpha * skeleton_embed(skeleton)
# The conv is zero-init, so step 0 is exactly the no-skeleton baseline whatever
# alpha is; alpha's real job is scaling the gradient into that kernel, capping
# how fast the skeleton path ramps up out of zero. 0.1 is OSCAR's value
# (additional_embed_alpha), where it was paired with a xavier init instead.
skeleton_embed_alpha: 0.1

# Windowing in latent space. Each latent frame corresponds to 4 raw frames.
# num_predicted_latents = number of future (predicted) latent frames;
# total window = num_history_latent_frames + num_predicted_latents.
num_history_latent_frames: 1
# Strided history sampling (ctrl-world style). skip_his is drawn uniformly from [1, max_skip_his]
# at train time; val always uses skip_his=1. skip_his_zero_prob collapses all history to frame_now.
max_skip_his: 3 #ctrl-world uses 8, which maps to 2 with 4x temporal compression (1 = no skipping, 2 = skip 1 frame, 3 = skip 2 frames)
skip_his_zero_prob: 0.15 #inline with ctrl_world 

# Path to stats.json (state_01 / state_99 arrays, produced by the data script).
action_stats_path: 'droid_wan_tfrecords_test/stats.json'

# CFG dropout probability on action tokens (zeroed for 5% of samples).
# Applies to the ACTION only — the task instruction, when enabled below, is
# added after this mask and is never dropped.
ctrl_cfg_drop_prob: 0.05

# Whether the DROID task instruction (the T5 token sequence already carried in
# the batch as text_embeds) reaches the model at all.
#
# Default False = what this model has always done: the action encoder was called
# with text_embed=None in both modes and the T5 tensor was loaded, sharded, and
# then ignored. The SVD ctrl_world arm defaults to True for the same
# preserve-existing-behaviour reason, so the two defaults differ — set this
# explicitly and identically in both when comparing the two models.
#
# Route when enabled, matched exactly by the SVD trainer:
#   cross_attn — masked-mean-pooled to (B, wan_text_dim) and added to the action
#                tokens. Pooled rather than concatenated because per-frame
#                locking reshapes the K/V to (B*F_lat, K, D), which a shared
#                512-token sequence cannot join.
#   adaln      — the full T5 sequence becomes the cross-attention context,
#                replacing the all-zero placeholder (the action has moved to the
#                timestep embedding, so cross-attention is free).
# Costs no parameters in either mode, so it does not affect checkpoint
# compatibility.
use_task_instructions: False

# ── History noise augmentation ─────────────────────────────────────────────────
# Corrupt history latent frames with flow-matching noise, each frame at its own
# independently sampled timestep t_hist ~ Uniform(0, history_noise_max_timestep).
# Teaches the model to tolerate imperfect (AR-generated) history.
# 0 = disabled (history always clean). Typical value: 100-200 (of 1000 train
# timesteps).
history_noise_max_timestep: 0
# Fraction of samples whose entire history window stays exactly clean
# (t_hist = 0), keeping the cold-start / ground-truth-history case
# in-distribution.
history_noise_clean_prob: 0.2
# False (blind, default): history tokens stay declared clean (t=0) — the model
#   learns to mildly distrust "clean" history, matching AR inference where the
#   true corruption level is unknown. No inference-side changes needed.
# True (conditioned): AdaLN is told each history frame's t_hist; AR inference
#   must then renoise generated history and declare the injected level.
history_noise_conditioned: False

# ── Video resolution ───────────────────────────────────────────────────────────
height: 704 #576
width:  1280 #1024
num_predicted_latents: 21   # future latent frames per window, exactly 4 raw frames each — the 1-frame
                            # anchor latent (episode frame 0) always falls in history, never predicted.

# ── Training loop ──────────────────────────────────────────────────────────────
learning_rate: 1.e-5
scale_lr: False
max_train_samples: -1
max_train_steps: 10001
num_train_epochs: 1
seed: 0
output_dir: '/scratch/gpfs/AM43/zz8976/maxdiffusion/wan-ctrl-world-output'
per_device_batch_size: 1.0
global_batch_size: 0
global_batch_size_to_train_on: 1
global_batch_size_to_load: 1
grad_accum_steps: 1  # number of micro-batches to accumulate before an optimizer update

warmup_steps_fraction: 0.05
learning_rate_schedule_steps: -1   # decay horizon; -1 => use max_train_steps
# Learning-rate decay tail after warmup:
#   constant — hold at learning_rate forever (legacy). Past convergence this lets
#              Adam's effective step grow as the 2nd moment decays, which slowly
#              walks the weights out of the minimum (loss creeps up, grads spike).
#   cosine   — cosine-decay learning_rate -> learning_rate * learning_rate_end_ratio
#              over learning_rate_schedule_steps (or max_train_steps if -1), then
#              hold at that floor. Set the horizon to where you intend to stop.
learning_rate_schedule_type: cosine
learning_rate_end_ratio: 0.0       # final LR = learning_rate * this (0.0 => decay to 0)
save_optimizer: True

adam_b1: 0.9
adam_b2: 0.999
# Raised from 1e-8: past convergence, grads shrink → Adam's 2nd moment v decays →
# effective step lr/(√v+eps) grows and walks weights out of the minimum. A larger
# eps floors √v+eps and caps that effective-LR growth (the late-run loss climb).
adam_eps: 1.e-6
# Raised from 0.0: restoring force toward 0, matters with the normalization layers;
# further damps the post-convergence drift.
adam_weight_decay: 0.01
opt_enable_grad_clipping: True
max_grad_value: 1.0
opt_enable_grad_global_norm_clipping: False
max_grad_norm: 1.0
# Skip the optimizer update entirely (params/opt_state/step revert) when the raw
# pre-clip global grad norm is non-finite or exceeds this. Retrain-from-20k data
# (through 30.9k steps): healthy raw per-step max stays <= ~5.4, window-avg
# 0.04-0.2, while the burst events measure 45+ (29700: 45.8) and the old run's
# escalation went 120 -> 1e9+. 10 skips every observed burst while never touching
# the healthy background. False skips are cheap (one lost batch); a missed bad
# update poisons Adam's moments for ~1/(1-b2) steps. 0 disables the guard.
# Skipped steps are logged with the batch's episode_ids and per-sample latent
# |max| for attribution.
grad_norm_skip_threshold: 0.0


# Log per-layer self-attention (attn1) qk-norm scale absmax + Q/K kernel norms
# each log window (train/norm_q_scale_last is the final block, _max/_argmax the
# worst block). Cheap; tests whether attention-logit growth is driving the
# late-training grad spikes. Set False to disable.
log_attn_param_stats: True

# Activation-level A-vs-B attention diagnostic. Eagerly recomputes each block's
# self-attention Q/K (flash hides them) to log, window-reduced:
#   train/logit_absmax_l29 / _maxblk  — max |QKᵀ|·scale (post qk-norm + RoPE).
#       Large (≳ tens) at spike windows ⇒ attention-logit growth / softmax
#       collapse ⇒ mechanism A (logit soft-cap is the fix).
#   train/rms_q_min_l29, train/rms_k_min_l29 — min qk-norm RMS denominator.
#       → sqrt(eps)=1e-3 at spike windows ⇒ near-zero-norm token blows up the
#       RMSNorm backward ⇒ mechanism B (raise qk-norm eps instead).
# EXPENSIVE (adds a chunked QKᵀ per block every step); enable only for short
# diagnostic runs. No gradient path, so it does not change training dynamics.
log_attn_activation_stats: False

# Whether to apply flow-matching per-sample loss weighting.
disable_training_weights: False

# Keep FULL. HIDDEN_STATE_WITH_OFFLOAD produced gradients that did not match
# the forward at the low-res sequence length (2160 tokens at 192x320, vs 23400
# at 480x832): loss stayed a healthy ~0.35 while grad_norm reached 1.1e8 and
# climbed. What proved it was the backward and not the model/data: turning on
# the attention diagnostics — mathematically gradient-free, they only add an
# aux output — moved grad_norm to 9.69 on the same data. FULL fixes it at
# acceptable overhead. tokamax_flash is not at fault.
remat_policy: "FULL"
names_which_can_be_saved: []
names_which_can_be_offloaded: []

checkpoint_every: 100
checkpoint_dir: ""
# Specific checkpoint step to load for inference. -1 = latest.
checkpoint_step: -1
# Keep every N-th checkpoint permanently (in addition to max_to_keep most recent). -1 = disabled.
checkpoint_keep_period: -1
enable_single_replica_ckpt_restoring: False
save_final_checkpoint: True

eval_every: 200
eval_data_dir: ""
eval_max_batches: 1

enable_profiler: False
skip_first_n_steps_for_profiler: 5
profiler_steps: 10
tensorboard_dir: ""
enable_jax_named_scopes: False

# ── Inference ──────────────────────────────────────────────────────────────────
output_video_fps: 5

# Sigma-schedule shift for inference/rollout sampling (generate script and the
# W&B video rollout). 5.0 matches the official Wan2.2 TI2V-5B sample_shift.
# Training-time timestep sampling is NOT affected (scheduler default shift=3).
inference_sigma_shift: 5.0

# Auto-regressive generation: generate ar_num_chunks * ar_chunk_size future
# latent frames by rolling the last n_hist generated frames as history.
# ar_chunk_size defaults to the single-pass future window (num_predicted_latents).
autoregressive: False
ar_chunk_size: 0   # 0 = auto-derive from num_predicted_latents
ar_num_chunks: 1

# By default the eval dataset drops any episode shorter than the full AR window
# (num_history_latent_frames + ar_num_chunks * ar_chunk_size), which at a
# 57-frame window leaves 8 of 110 val episodes. With this on, short episodes are
# kept and the window is padded by repeating their last real action, so the
# rollout runs the full length; the GT half of the comparison video freezes at
# the last real frame. RoPE positions keep advancing through the padding.
# Only applies when autoregressive=True.
eval_pad_short_episodes: False
eval_min_latent_frames: 0   # 0 = keep any episode with >= 2 latent frames

