# Base config for Stable Video Diffusion (base) — 14 frames @ 576x1024, img2vid.

run_name: ''

metrics_file: ""
write_metrics: True
timing_metrics_file: ""
write_timing_metrics: True
gcs_metrics: False
save_config_to_gcs: False
log_period: 100

pretrained_model_name_or_path: 'stabilityai/stable-video-diffusion-img2vid'
model_name: svd
model_type: 'I2V'

unet_checkpoint: ''
revision: ''
weights_dtype: 'bfloat16'
activations_dtype: 'bfloat16'

# Replicate VAE instead of sharding.
replicate_vae: False

precision: "DEFAULT"
scan_layers: True
jit_initializers: True

# Load PyTorch safetensors weights.
from_pt: True
split_head_dim: True

# Spatial attention uses flash; temporal attention falls back to dot_product
# (T=14 is too short for SplashAttention block sizes).
attention: 'flash'
temporal_attention: 'dot_product'
# Chunked-query attention path. Off by default on TPU (`flash` already
# avoids N×N materialization). Turn on when running dot_product attention
# on a memory-constrained GPU — see base_svd_gpu.yml.
use_memory_efficient_attention: False
flash_min_seq_length: 4096
dropout: 0.0

mask_padding_tokens: True
attention_sharding_uniform: True

flash_block_sizes: {
  "block_q": 2048,
  "block_kv_compute": 512,
  "block_kv": 2048,
  "block_q_dkv": 2048,
  "block_kv_dkv": 2048,
  "block_kv_dkv_compute": 512,
  "use_fused_bwd_kernel": True
}

norm_num_groups: 32

# SVD has no text encoder.
train_text_encoder: False
text_encoder_learning_rate: 0.0

snr_gamma: -1.0

timestep_bias: {
  strategy: "none",
  multiplier: 1.0,
  begin: 0,
  end: 1000,
  portion: 0.25
}

# EDM scheduler config for base SVD.
diffusion_scheduler_config: {
  prediction_type: 'v_prediction',
  sigma_min: 0.002,
  sigma_max: 700.0,
  rho: 7.0,
  timestep_spacing: 'edm'
}

base_output_directory: ""

hardware: 'tpu'
skip_jax_distributed_system: False

mesh_axes: ['data', 'fsdp', 'context', 'tensor']

logical_axis_rules: [
                      ['batch', ['data', 'fsdp']],
                      ['activation_batch', ['data', 'fsdp']],
                      ['activation_self_attn_heads', ['context', 'tensor']],
                      ['activation_cross_attn_q_length', ['context', 'tensor']],
                      ['activation_length', 'context'],
                      ['activation_heads', 'tensor'],
                      ['mlp', 'tensor'],
                      ['embed', ['context', 'fsdp']],
                      ['heads', 'tensor'],
                      ['norm', 'tensor'],
                      ['conv_batch', ['data', 'context', 'fsdp']],
                      ['out_channels', 'tensor'],
                      ['conv_out', 'context'],
                    ]
vae_logical_axis_rules: [
                          ['activation_batch', 'redundant'],
                          ['activation_length', 'vae_spatial'],
                          ['activation_heads', null],
                          ['activation_kv_length', null],
                          ['embed', null],
                          ['heads', null],
                          ['norm', null],
                          ['conv_batch', 'redundant'],
                          ['out_channels', 'vae_spatial'],
                          ['conv_out', 'vae_spatial'],
                          ['conv_in', 'vae_spatial'],
                        ]
data_sharding: [['data', 'fsdp', 'context', 'tensor']]

dcn_data_parallelism: 1
dcn_fsdp_parallelism: -1
dcn_context_parallelism: 1
dcn_tensor_parallelism: 1
ici_data_parallelism: 1
ici_fsdp_parallelism: -1
ici_context_parallelism: 1
ici_tensor_parallelism: 1

allow_split_physical_axes: False

# Dataset fields (unused for inference but kept for pyconfig compat).
dataset_name: ''
train_split: 'train'
dataset_type: 'tfrecord'
cache_latents_text_encoder_outputs: False
dataset_save_location: ''
load_tfrecord_cached: False
train_data_dir: ''
dataset_config_name: ''
jax_cache_dir: ''
hf_data_dir: ''
hf_train_files: ''
hf_access_token: ''
image_column: 'image'
caption_column: 'text'
resolution: 1024
center_crop: False
random_flip: False
tokenize_captions_num_proc: 4
transform_images_num_proc: 4
reuse_example_batch: False
enable_data_shuffling: True

# Remat is mandatory at 14x576x1024 resolution.
remat_policy: "MATMUL_WITHOUT_BATCH"
names_which_can_be_saved: []
names_which_can_be_offloaded: []

checkpoint_every: -1
checkpoint_dir: ""
enable_single_replica_ckpt_restoring: False

# Training loop (not exercised for SVD inference).
learning_rate: 1.e-5
scale_lr: False
max_train_samples: -1
max_train_steps: 1500
num_train_epochs: 1
seed: 0
output_dir: 'svd-output'
per_device_batch_size: 1.0
global_batch_size: 0

tfrecords_dir: ''
no_records_per_shard: 0
enable_eval_timesteps: False
timesteps_list: []
num_eval_samples: 0

warmup_steps_fraction: 0.1
learning_rate_schedule_steps: -1
save_optimizer: False

adam_b1: 0.9
adam_b2: 0.999
adam_eps: 1.e-8
adam_weight_decay: 0.0
opt_enable_grad_clipping: False
max_grad_value: 1.0
opt_enable_grad_global_norm_clipping: False
max_grad_norm: 1.0

enable_profiler: False
skip_first_n_steps_for_profiler: 5
profiler_steps: 10

enable_jax_named_scopes: False

# SVD generation parameters.
# Conditioning image; URL or local path.
image_url: "https://huggingface.co/datasets/huggingface/documentation-images/resolve/main/diffusers/astronaut.jpg"
prompt: ""
prompt_2: ""
negative_prompt: ""
do_classifier_free_guidance: True
height: 576
width: 1024
num_frames: 14
# For SVD, guidance ramps linearly per frame from min to max.
min_guidance_scale: 1.0
max_guidance_scale: 2.5
# Single scalar scale is unused for SVD (kept for pyconfig compat).
guidance_scale: 2.5
flow_shift: 0.0

guidance_rescale: 0.0
num_inference_steps: 25
# Output frame rate.
fps: 7
save_final_checkpoint: False

# SVD-specific micro-conditioning.
# fps_id = fps - 1.
fps_id: 6
motion_bucket_id: 127
# Noise strength added to the conditioning image latent before concat.
cond_aug: 0.02

# Number of frames to decode at once. Lower values reduce VAE decode peak
# memory at the cost of a small temporal discontinuity at chunk boundaries
# (the VAE temporal conv has kernel=3). Set to num_frames to decode in one
# pass. Diffusers exposes the same knob as `decode_chunk_size`.
decode_chunk_size: 1

# Optional directory for debug dumps (VAE-preprocessed input, VAE round-trip
# of the conditioning image tiled over T). Leave empty to disable.
# If frame 0 of debug_vae_roundtrip_frame00.png does NOT match image_0.png,
# the VAE load or conditioning path is broken. If it DOES match, the bug is
# in the UNet forward or the EDM sampling loop.
debug_dir: ''

# VAE latent scale.
vae_scale_factor: 0.18215

# CLIP image encoder: empty => use `<pretrained_model_name_or_path>/image_encoder`
# (Diffusers ships a fine-tuned CLIPVisionModelWithProjection under that subfolder
# that matches SGM's FrozenOpenCLIPImageEmbedder). Override with e.g.
# "laion/CLIP-ViT-H-14-laion2B-s32B-b79K" to use the vanilla OpenCLIP weights.
image_encoder_pretrained_model_name_or_path: ''

# SDXL Lightning (unused).
lightning_from_pt: False
lightning_repo: ""
lightning_ckpt: ""

# LoRA (unused for SVD).
enable_lora: False
lora_config: {
  rank: [],
  lora_model_name_or_path: [],
  weight_name: [],
  adapter_name: [],
  scale: [],
  from_pt: []
}

enable_mllog: False

# Unused controlnet fields (kept for pyconfig compat).
controlnet_model_name_or_path: ''
controlnet_from_pt: False
controlnet_conditioning_scale: 0.0
controlnet_image: ''
quantization: ''
quantization_local_shard_count: -1
compile_topology_num_slices: -1
use_qwix_quantization: False
quantization_calibration_method: "absmax"
qwix_module_path: ".*"

eval_every: -1
eval_data_dir: ""
enable_generate_video_for_eval: False
eval_max_number_of_samples_in_bucket: 0

enable_ssim: False

enable_ml_diagnostics: False
profiler_gcs_path: ""
enable_ondemand_xprof: False
