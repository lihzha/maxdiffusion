# Stable Diffusion 1.5 inference on a single NVIDIA GPU.
# Usage:
#   JAX_PLATFORMS=cuda python -m maxdiffusion.generate \
#       src/maxdiffusion/configs/base14_gpu.yml
# Optional CLI overrides: prompt="..." num_inference_steps=30 seed=0

run_name: 'sd15_gpu_test'

metrics_file: ""
write_metrics: False
gcs_metrics: False
timing_metrics_file: ""
write_timing_metrics: False
save_config_to_gcs: False
log_period: 10000000000

# CompVis SD 1.4; native Flax weights live on revision="flax".
# (Runway's SD 1.5 flax branch was removed from HF — use CompVis/sd-v1-4 or
# flip to from_pt=True + a PT-only mirror if you specifically want SD 1.5.)
pretrained_model_name_or_path: 'CompVis/stable-diffusion-v1-4'
unet_checkpoint: ''
revision: 'flax'

weights_dtype: 'float32'
activations_dtype: 'bfloat16'
precision: "DEFAULT"

jit_initializers: True

# Flax weights already on the hub — no PT conversion needed.
from_pt: False
split_head_dim: True
# dot_product runs on GPU without TransformerEngine. Switch to
# "cudnn_flash_te" later once transformer_engine[jax] is installed.
attention: 'dot_product'
mask_padding_tokens: True
attention_sharding_uniform: True
flash_block_sizes: {}
norm_num_groups: 32

train_new_unet: False
train_text_encoder: False
text_encoder_learning_rate: 4.25e-6
snr_gamma: -1.0

timestep_bias: {
  strategy: "none",
  multiplier: 1.0,
  begin: 0,
  end: 1000,
  portion: 0.25
}

diffusion_scheduler_config: {
  _class_name: '',
  prediction_type: '',
  rescale_zero_terminal_snr: False,
  timestep_spacing: ''
}

# -------- Hardware --------
hardware: 'gpu'
# Single-host single-GPU: no distributed bootstrap needed.
skip_jax_distributed_system: True

base_output_directory: ""

# -------- Parallelism --------
# 1x1x1x1 mesh on a single GPU. Rules still match names used inside the model.
mesh_axes: ['data', 'fsdp', 'context', 'tensor']

logical_axis_rules: [
                      ['batch', 'data'],
                      ['activation_batch', ['data','fsdp']],
                      ['activation_heads', 'tensor'],
                      ['activation_kv', 'tensor'],
                      ['embed','fsdp'],
                      ['heads', 'tensor'],
                      ['conv_batch', ['data','fsdp']],
                      ['out_channels', 'tensor'],
                      ['conv_out', 'fsdp'],
                    ]
data_sharding: [['data', 'fsdp', 'context', 'tensor']]

dcn_data_parallelism: 1
dcn_fsdp_parallelism: 1
dcn_context_parallelism: 1
dcn_tensor_parallelism: 1
ici_data_parallelism: 1
ici_fsdp_parallelism: 1
ici_context_parallelism: 1
ici_tensor_parallelism: 1

allow_split_physical_axes: False

# -------- Dataset (unused for inference; kept for pyconfig compat) --------
dataset_name: 'diffusers/pokemon-gpt4-captions'
train_split: 'train'
dataset_type: 'tf'
cache_latents_text_encoder_outputs: True
dataset_save_location: '/tmp/pokemon-gpt4-captions_sd15_gpu'
train_data_dir: ''
dataset_config_name: ''
# Persistent jax cache disabled on GPU — the LegacyGpuAotCompilationResult
# serializer writes corrupt entries that load as OOM on the next run.
jax_cache_dir: ''
hf_data_dir: ''
hf_train_files: ''
hf_access_token: ''
image_column: 'image'
caption_column: 'text'
resolution: 512
center_crop: False
random_flip: False
tokenize_captions_num_proc: 4
transform_images_num_proc: 4
reuse_example_batch: False
enable_data_shuffling: True

# -------- Checkpoint --------
checkpoint_every: -1
enable_single_replica_ckpt_restoring: False

# -------- Training loop (unused for inference) --------
learning_rate: 1.e-7
scale_lr: False
max_train_samples: -1
max_train_steps: 800
seed: 0
output_dir: '/tmp/sd15_gpu_out'
per_device_batch_size: 1

warmup_steps_fraction: 0.0
learning_rate_schedule_steps: -1

adam_b1: 0.9
adam_b2: 0.999
adam_eps: 1.e-8
adam_weight_decay: 1.e-2
opt_enable_grad_clipping: False
max_grad_value: 1.0
opt_enable_grad_global_norm_clipping: False
max_grad_norm: 1.0

enable_profiler: False
skip_first_n_steps_for_profiler: 1
profiler_steps: 5

# -------- Generation parameters --------
prompt: "A happy puppy"
negative_prompt: "purple, red"
guidance_scale: 7.5
guidance_rescale: 0.0
num_inference_steps: 30

enable_mllog: False

# controlnet (unused here)
controlnet_model_name_or_path: 'lllyasviel/sd-controlnet-canny'
controlnet_from_pt: True
controlnet_conditioning_scale: 1.0
controlnet_image: 'https://huggingface.co/datasets/YiYiXu/test-doc-assets/resolve/main/blog_post_cell_10_output_0.jpeg'

# dreambooth (unused here)
instance_data_dir: ''
class_data_dir: ''
instance_prompt: ''
class_prompt: ''
prior_loss_weight: 1.0
num_class_images: 100
cache_dreambooth_dataset: False

quantization: ''
quantization_local_shard_count: -1
use_qwix_quantization: False
compile_topology_num_slices: -1

enable_ml_diagnostics: False
profiler_gcs_path: ""
enable_ondemand_xprof: False
