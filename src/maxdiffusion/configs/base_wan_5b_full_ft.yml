# Wan2.2 TI2V 5B FULL-FINETUNE overfit diagnostic on cached DROID latent windows.
#
# Purpose: diagnostic full-FT overfit probe -- measure how fast a FULLY-TRAINABLE
# Wan2.2 TI2V 5B backbone (NO adapter) memorizes the DROID train split, isolating
# "is the pipeline learnable at all" from "is frozen-backbone + adapter the bottleneck".
# Design and cohort protocol: docs/worklogs_yixun/exp_01_full_ft_overfit_claude/
# plan_full_ft_overfit.md. Dispatched by model_type: FULL_FT_TI2V (train_wan.py ->
# WanTI2VFullFTTrainer). This is a full standalone copy of base_wan_5b_side_adapter.yml
# (pyconfig loads exactly one file, no includes) with only the deltas noted below.
#
# CFG bypass (plan §2.1): with no adapter both CFG branches are the same trainable net,
# so side_adapter_guide_scale is pinned to 1.0 (bypass) and the trainer ASSERTS it --
# this removes an uncontrolled x5 pre-optimizer gradient / clip interaction and halves
# compute. side_adapter_noise_mode stays 'fresh' (asserted; 'fixed' silently breaks
# generation). Actions are parsed but UNUSED (z_i0 pin + null-text conditioning only).
#
# Inert adapter keys: action_adapter_type / action_* / side_adapter_* / pre_context_*
# below are RETAINED for config-shape parity but do nothing in a full-FT run (no adapter
# is built); only side_adapter_guide_scale / side_adapter_noise_mode / side_adapter_
# sampling_steps / side_adapter_t_sampling / flow_* are consumed (objective + rollout).
#
# Recipe amendment (plan §2.2 v3.1, Query 7, 2026-07-19): fit probe #4 proved per-device 8
# OOMs v6e-64 by ~37MB (FSDP collective buffers full-FT pays that the frozen-adapter runs
# did not), so the primary recipe is per_device_batch_size 4 => GBS 256, and
# max_train_steps 20000 -- the sample budget is unchanged (256 x 20000 = 5.12M ~= 3.55
# train-set passes). Cohort evals move to the samples-seen quarters: steps
# 5000/10000/15000/20000 (+ step-0 baseline).
#
# G1 retention (plan §2.2): checkpoint_keep_period == checkpoint_every == 2500 so Orbax
# keeps every 2500-multiple checkpoint (they survive despite max_to_keep) -- the amended
# cohort steps 5000/10000/15000/20000 are all multiples of 2500, so all survive for the
# cohort evaluation; the copied 5000 would have evicted the intermediate 2500-multiples.

run_name: ''

metrics_file: ""
write_metrics: True
timing_metrics_file: ""
write_timing_metrics: True
gcs_metrics: False
save_config_to_gcs: False
log_period: 10
wandb_project: 'maxdiffusion-wan-full-ft'   # delta (§6/F1): W&B on by default for the plain-yml launch; single source of truth with the launcher full_ft arm (pinned by test)
wandb_entity: ''

pretrained_model_name_or_path: 'Wan-AI/Wan2.2-TI2V-5B-Diffusers'
model_name: wan2.2
model_type: 'FULL_FT_TI2V'   # delta: dispatch to WanTI2VFullFTTrainer (frozen->fully trainable)
wan_transformer_pretrained_model_name_or_path: ''
unet_checkpoint: ''
revision: ''
from_pt: True

weights_dtype: 'bfloat16'
activations_dtype: 'bfloat16'
precision: "DEFAULT"
scan_layers: False
jit_initializers: True
split_head_dim: True

replicate_vae: False
attention: 'flash'
use_memory_efficient_attention: False
flash_min_seq_length: 4096
flash_block_sizes: {}
norm_num_groups: 32
dropout: 0.0
mask_padding_tokens: True
attention_sharding_uniform: True

train_text_encoder: False
text_encoder_learning_rate: 0.0
snr_gamma: -1.0

timestep_bias: {
  strategy: "none",
  multiplier: 1.0,
  begin: 0,
  end: 1000,
  portion: 0.25
}

base_output_directory: ""
hardware: 'tpu'
skip_jax_distributed_system: False

mesh_axes: ['data', 'fsdp', 'context', 'tensor']
logical_axis_rules: [
                      ['batch', ['data', 'fsdp']],
                      ['activation_batch', ['data', 'fsdp']],
                      ['activation_self_attn_heads', ['context', 'tensor']],
                      ['activation_cross_attn_q_length', ['context', 'tensor']],
                      ['activation_length', 'context'],
                      ['activation_heads', 'tensor'],
                      ['mlp', 'tensor'],
                      ['embed', ['context', 'fsdp']],
                      ['heads', 'tensor'],
                      ['norm', 'tensor'],
                      ['conv_batch', ['data', 'context', 'fsdp']],
                      ['out_channels', 'tensor'],
                      ['conv_out', 'context'],
                    ]
vae_logical_axis_rules: [
                          ['activation_batch', 'redundant'],
                          ['activation_length', 'vae_spatial'],
                          ['activation_heads', null],
                          ['activation_kv_length', null],
                          ['embed', null],
                          ['heads', null],
                          ['norm', null],
                          ['conv_batch', 'redundant'],
                          ['out_channels', 'vae_spatial'],
                          ['conv_out', 'vae_spatial'],
                          ['conv_in', 'vae_spatial'],
                        ]
data_sharding: [['data', 'fsdp', 'context', 'tensor']]

dcn_data_parallelism: 1
dcn_fsdp_parallelism: -1
dcn_context_parallelism: 1
dcn_tensor_parallelism: 1
ici_data_parallelism: 1
ici_fsdp_parallelism: -1
ici_context_parallelism: 1
ici_tensor_parallelism: 1
allow_split_physical_axes: False

# Dataset. Conversion writes these exact window-level fields:
# z_i0    float16 [48, 1, 12, 20]
# z_video float16 [48, 9, 12, 20]
# actions float32 [32, 7]
dataset_name: ''
train_split: 'train'
dataset_type: 'tfrecord'
cache_latents_text_encoder_outputs: True
dataset_save_location: ''
load_tfrecord_cached: False
train_data_dir: 'gs://v6_east1d/datasets/droid_wan_side_adapter/train'
eval_data_dir: 'gs://v6_east1d/datasets/droid_wan_side_adapter/train'   # delta (F7): in-training eval on the TRAIN split (== train_data_dir)
dataset_config_name: ''
jax_cache_dir: ''
hf_data_dir: ''
hf_train_files: ''
hf_access_token: ''
image_column: 'image'
caption_column: 'text'
enable_data_shuffling: True
tfrecord_shuffle_buffer_size: -1
reuse_example_batch: False

# Wan2.2 TI2V 5B architecture. The loader reads the detailed transformer config
# from the pretrained diffusers checkpoint; these values keep config-derived
# helper shapes aligned with Wan2.2 2.2 latents.
in_channels: 48
out_channels: 48
text_dim: 4096
freq_dim: 256
ffn_dim: 13824
num_layers: 40
num_attention_heads: 40
attention_head_dim: 128

# Cached DROID latent window geometry: 33 raw frames -> 9 latent frames.
latent_channels: 48
latent_frames: 9
latent_height: 12
latent_width: 20
height: 192
width: 320
num_frames: 32
wan_max_sequence_length: 512

# Side adapter. Defaults match ../Wan2.2 distributed DROID side-adapter run.
action_adapter_type: 'side_adapter'
action_dim: 7
action_len: 32
action_repr: 'delta'
action_tokens: 8
action_hidden: 512
action_heads: 4
side_adapter_layers: '0-29'
side_adapter_hidden: 512
side_adapter_heads: 8
pre_context_tokens: 8
pre_context_heads: 8
side_adapter_sampling_steps: 25
side_adapter_noise_mode: 'fresh'
side_adapter_t_sampling: 'uniform'
side_adapter_logit_normal_mu: 0.0
side_adapter_logit_normal_sigma: 1.0
side_adapter_guide_scale: 1.0   # delta (§2.1): CFG bypass -- asserted by the full-FT trainer
flow_shift: 5.0
flow_sigma_min: 0.0
flow_sigma_max: 1.0

# Training loop.
learning_rate: 1.e-5   # delta (§2.2): full-FT LR. Keep the '.' so yaml parses a float (1e-5 parses as str)
scale_lr: False
max_train_samples: -1
max_train_steps: 20000   # delta (§2.2 v3.1, Query 7): 20000 @ GBS 256 = 5.12M samples ~= 3.55 passes (budget unchanged)
num_train_epochs: 1
seed: 0
output_dir: 'gs://v6_east1d/checkpoints/maxdiffusion/wan-ti2v-full-ft'   # delta: full-FT checkpoint root
# delta (§6/F1; amended §2.2 v3.1): primary-run batch recipe, self-consistent standalone.
# pyconfig.user_init RECOMPUTES both global_batch_size_to_* keys unconditionally at
# initialize time as int(num_devices * per_device_batch_size) (load clamped up to
# num_devices when per_device < 1), so per_device_batch_size is the ONLY authoritative
# batch knob: 4.0 -> GBS 256 on the v6e-64 primary target, making the plain
# `python train_wan.py <this yml> run_name=...` command satisfy plan §6 (GBS 256).
# Per-device 8 does NOT fit v6e-64 (fit probe #4: HBM over by ~37MB -- FSDP collective
# buffers; Query 7 approved the 4/256 amendment). The 256s below document the resolved
# v6e-64 values; they are inert inputs (always overwritten) kept coherent so the
# standalone yml never contradicts itself.
per_device_batch_size: 4.0
global_batch_size: 0
global_batch_size_to_train_on: 256
global_batch_size_to_load: 256

warmup_steps_fraction: 0.05
learning_rate_schedule_steps: -1
save_optimizer: True

adam_b1: 0.9
adam_b2: 0.999
adam_eps: 1.e-8
adam_weight_decay: 1.e-2
opt_enable_grad_clipping: False
max_grad_value: 1.0
opt_enable_grad_global_norm_clipping: True
max_grad_norm: 1.0
disable_training_weights: True

remat_policy: "FULL"
names_which_can_be_saved: []
names_which_can_be_offloaded: []

checkpoint_every: 2500   # delta (§2.2): every 2500 steps; amended cohort evals at 5000/10000/15000/20000 (all multiples)
checkpoint_dir: ""
checkpoint_step: -1
checkpoint_keep_period: 2500   # delta (G1): keep every 2500-multiple so all cohort ckpts survive
enable_single_replica_ckpt_restoring: False
save_final_checkpoint: True

eval_every: 1000
eval_max_batches: 4

enable_profiler: False
skip_first_n_steps_for_profiler: 5
profiler_steps: 10
enable_jax_named_scopes: False

# Inference/config compatibility fields.
num_eval_videos: 1
validation_output_dir: ''
validation_start_index: 0
# delta (plan §2.3): comma-separated 0-based dataset positions for the fixed memorization
# cohort (e.g. "0,90000,180000,..."); MUST exist here so `validation_ordinals=...` is a
# valid pyconfig CLI override. Empty -> contiguous validation_start_index read.
validation_ordinals: ''
# delta (Part II / Query 8, plan D5): keys for the full-validation one-step-loss evaluator
# (eval_wan_full_ft_val_loss.py). All CLI-overridable; the evaluator REQUIRES the first two.
# validation_checkpoint_steps: comma-separated POSITIVE checkpoint steps to evaluate (e.g.
#   "2500,5000,...,20000"); must be non-empty. validation_expected_count: the exact held-out
#   window count the reader must drain to (e.g. 14636); must be >0 and is asserted BEFORE any
#   restore. validation_loss_output_dir: explicit output root; empty ->
#   {output_dir}/{run_name}/validation_loss (SMOKE_LIMIT -> validation_loss_smoke).
validation_checkpoint_steps: ''
validation_expected_count: 0
validation_loss_output_dir: ''
validation_seed: 0
min_guidance_scale: 1.0
max_guidance_scale: 2.5
guidance_scale: 5.0
guidance_rescale: 0.0
num_inference_steps: 25
fps: 16
fps_id: 6
motion_bucket_id: 127
cond_aug: 0.02
decode_chunk_size: 8
vae_scale_factor: 0.18215
vae_scaling_factor: 0.18215
image_url: ''
prompt: ''
prompt_2: ''
negative_prompt: ''
do_classifier_free_guidance: True
image_encoder_pretrained_model_name_or_path: ''
lightning_from_pt: False
lightning_repo: ""
lightning_ckpt: ""
enable_lora: False
lora_config: {
  rank: [],
  lora_model_name_or_path: [],
  weight_name: [],
  adapter_name: [],
  scale: [],
  from_pt: []
}

enable_mllog: False
quantization: ''
quantization_local_shard_count: -1
compile_topology_num_slices: -1
use_qwix_quantization: False
weight_quantization_calibration_method: "absmax"
act_quantization_calibration_method: "absmax"
bwd_quantization_calibration_method: "absmax"
qwix_module_path: ".*"

enable_generate_video_for_eval: False
enable_ssim: False
enable_ml_diagnostics: False
profiler_gcs_path: ""
enable_ondemand_xprof: False
