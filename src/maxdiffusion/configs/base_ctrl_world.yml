# Base config for action-conditioned SVD (Ctrl-World) training on TPU.
#
# Loads UNet + VAE config + (optionally) UNet weights from
# `pretrained_model_name_or_path` (default: stabilityai/stable-video-diffusion-img2vid).
# Action encoder is initialised from scratch unless `action_encoder_init_path`
# points at a safetensors file produced by scripts/convert_ctrl_world_ckpt.py.
#
# Data: pre-encoded TFRecord shards as documented in
# docs/ctrl_world_data_format.md. Set train_data_dir / eval_data_dir / stats_path.

run_name: ''

metrics_file: ""
write_metrics: True
timing_metrics_file: ""
write_timing_metrics: True
gcs_metrics: False
save_config_to_gcs: False
log_period: 100
wandb_project: ''   # set to enable W&B logging (e.g. 'svd-ctrl-world')
wandb_entity: ''    # W&B team/user; empty = personal account
# Log a GT-vs-prediction rollout video every N steps (0 = off). Requires
# wandb_project and eval_data_dir. Opt-in because it loads the VAE decoder
# (~2.7 GB) that training otherwise never needs — latents are pre-encoded.
# Single-chunk rollout: history and the conditioning frame come from the eval
# window, the num_frames future slots are generated from noise.
wandb_video_every: 0
wandb_video_samples: 1            # eval samples to decode and log per video step
wandb_video_inference_steps: 25   # EDM Euler steps for the rollout
wandb_video_guidance_scale: 1.0   # >1.0 enables action CFG (doubles rollout compute)

# UNet + VAE come from base SVD by default. Point this at the directory produced
# by scripts/convert_ctrl_world_ckpt.py to warm-start from a Ctrl-World ckpt.
pretrained_model_name_or_path: 'stabilityai/stable-video-diffusion-img2vid'
model_name: ctrl_world
model_type: 'I2V'

# Optional: load action encoder weights from a Ctrl-World safetensors dump
# (out_dir/action_encoder.safetensors of convert_ctrl_world_ckpt.py).
# Empty string => initialise from scratch.
action_encoder_init_path: ''

unet_checkpoint: ''
revision: ''
# float32 master weights with bfloat16 activations — upstream Ctrl-World's
# mixed_precision='fp16' setup, and a correctness requirement at this LR: bf16
# has 7 mantissa bits, so near a 0.01-magnitude weight the representable spacing
# is ~6.1e-5 and a learning_rate=1e-5 Adam step (or the 1e-7 weight-decay term)
# rounds away to nothing. Params AND the Adam moments follow this dtype, so bf16
# here silently stalls most of the UNet; only the f32-pinned leaves keep
# training. Costs 2x param + 2x optimizer HBM, which FSDP shards.
# Inference is unaffected and can stay bf16.
weights_dtype: 'float32'
activations_dtype: 'bfloat16'

precision: "DEFAULT"
scan_layers: True
jit_initializers: True

from_pt: True
split_head_dim: True

attention: 'flash'
temporal_attention: 'dot_product'
use_memory_efficient_attention: False
flash_min_seq_length: 4096
dropout: 0.0

mask_padding_tokens: True
attention_sharding_uniform: True

flash_block_sizes: {
  "block_q": 2048,
  "block_kv_compute": 512,
  "block_kv": 2048,
  "block_q_dkv": 2048,
  "block_kv_dkv": 2048,
  "block_kv_dkv_compute": 512,
  "use_fused_bwd_kernel": True
}

norm_num_groups: 32

train_text_encoder: False
text_encoder_learning_rate: 0.0
snr_gamma: -1.0

timestep_bias: {
  strategy: "none",
  multiplier: 1.0,
  begin: 0,
  end: 1000,
  portion: 0.25
}

base_output_directory: ""
hardware: 'tpu'
skip_jax_distributed_system: False

mesh_axes: ['data', 'fsdp', 'context', 'tensor']
logical_axis_rules: [
                      ['batch', ['data', 'fsdp']],
                      ['activation_batch', ['data', 'fsdp']],
                      ['activation_self_attn_heads', ['context', 'tensor']],
                      ['activation_cross_attn_q_length', ['context', 'tensor']],
                      ['activation_length', 'context'],
                      ['activation_heads', 'tensor'],
                      ['mlp', 'tensor'],
                      ['embed', ['context', 'fsdp']],
                      ['heads', 'tensor'],
                      ['norm', 'tensor'],
                      ['conv_batch', ['data', 'context', 'fsdp']],
                      ['out_channels', 'tensor'],
                      # Do NOT add ['conv_in', ['fsdp']] here. Conv weights are
                      # annotated P('keep_1','keep_2','conv_in','conv_out'), so such a
                      # rule shards axis 2 — the input-channel axis the convolution
                      # CONTRACTS over. That was measured to corrupt the forward pass:
                      # activations escalated through the down blocks (37 -> 96 -> 114)
                      # and went NaN at up_blocks_0 (33M NaN, absmax 2048), which is
                      # where the 2560-input-channel kernels live. Removing it makes
                      # the same batch fully finite (loss 0.196, up_0 absmax 72.5) with
                      # bit-identical weights, so the checkpoint was never at fault.
                      # Cost of leaving it out: those 764M conv params stay replicated,
                      # ~8.55 GiB/device of state instead of ~4.41. To recover that,
                      # shard the OUTPUT axis instead — ['conv_out', 'fsdp'] rather than
                      # 'context' (what base14.yml does) — which is a plain output split
                      # and needs no contraction-dim reduction. Untested here.
                      ['conv_out', 'context'],
                    ]
data_sharding: [['data', 'fsdp', 'context', 'tensor']]

dcn_data_parallelism: 1
dcn_fsdp_parallelism: -1
dcn_context_parallelism: 1
dcn_tensor_parallelism: 1
ici_data_parallelism: 1
ici_fsdp_parallelism: -1
ici_context_parallelism: 1
ici_tensor_parallelism: 1
allow_split_physical_axes: False

# Dataset.
dataset_name: ''
train_split: 'train'
dataset_type: 'ctrl_world'
cache_latents_text_encoder_outputs: True   # latents are pre-encoded on disk
dataset_save_location: ''
load_tfrecord_cached: False
train_data_dir: ''
eval_data_dir: ''
stats_path: ''
dataset_config_name: ''
jax_cache_dir: ''
hf_data_dir: ''
hf_train_files: ''
hf_access_token: ''
image_column: 'image'
caption_column: 'text'
resolution: 1024
center_crop: False
random_flip: False
tokenize_captions_num_proc: 4
transform_images_num_proc: 4
reuse_example_batch: False
enable_data_shuffling: True

# Ctrl-World windowing knobs (defaults match Ctrl-World/dataset_droid_exp33.py).
ctrl_world_down_sample: 3
ctrl_world_max_skip: 2
ctrl_world_max_skip_his: 8
ctrl_world_skip_his_zero_prob: 0.15
ctrl_world_shuffle_buffer: 512

remat_policy: "MATMUL_WITHOUT_BATCH"
names_which_can_be_saved: []
names_which_can_be_offloaded: []

checkpoint_every: 5000
checkpoint_dir: ""
enable_single_replica_ckpt_restoring: False
# How many checkpoints to retain on disk. Each one holds params + optimizer
# state, so keep this small when save_optimizer is True.
checkpoint_max_to_keep: 3
# On restart, advance the input-pipeline seed so training resumes on a freshly
# shuffled data stream instead of replaying the exact windows the previous launch
# already saw. Set False for a bit-comparable rerun.
reshuffle_data_on_restart: True

# Training loop.
learning_rate: 1.e-5
scale_lr: False
max_train_samples: -1
max_train_steps: 200000
num_train_epochs: 1
seed: 0
output_dir: 'ctrl-world-output'
per_device_batch_size: 1.0
global_batch_size: 0

warmup_steps_fraction: 0.05
learning_rate_schedule_steps: -1
# Required for faithful mid-training resume: without it, Adam moments and the
# LR-schedule position restart from zero every time the job comes back up.
save_optimizer: True

adam_b1: 0.9
adam_b2: 0.999
adam_eps: 1.e-8
# Matches upstream Ctrl-World, which builds `torch.optim.AdamW(params, lr=...)`
# and so inherits torch's default weight_decay=0.01 (scripts/train_wm.py). optax's
# adamw decay is decoupled and lr-scaled exactly like torch's, so the value
# transfers directly.
adam_weight_decay: 0.01
opt_enable_grad_clipping: False
max_grad_value: 1.0
opt_enable_grad_global_norm_clipping: True
max_grad_norm: 1.0
# Skip the optimizer update entirely on a non-finite gradient, instead of letting
# it reach the clip and the Adam moments. Neither clip helps here: clip() maps
# inf -> max_grad_value but passes NaN through, and clip_by_global_norm() turns a
# single inf into NaN across *every* parameter (scale = max_grad_norm/inf = 0, and
# 0 * inf = NaN), so one bad batch permanently poisons the moments and every later
# step reports loss=nan. Skipping costs one batch. After
# opt_max_consecutive_nonfinite consecutive bad steps optax stops skipping and
# lets the update through, so a genuinely broken run still fails loudly.
opt_skip_nonfinite_updates: True
opt_max_consecutive_nonfinite: 100

enable_profiler: False
skip_first_n_steps_for_profiler: 5
profiler_steps: 10
enable_jax_named_scopes: False

# Ctrl-World train-step knobs (mirror CtrlWorldTrainConfig defaults).
num_history: 7
num_frames: 5
action_dim: 7
text_embed_dim: 512
hidden_size: 1024
ctrl_p_mean: 0.7
ctrl_p_std: 1.6
ctrl_cond_aug_max: 0.2
ctrl_history_sigma_std: 0.3
ctrl_cfg_drop_prob: 0.05
ctrl_fps_id: 7.0
ctrl_motion_bucket_id: 127.0
ctrl_noise_aug_strength: 0.0
ctrl_his_cond_zero: False

# How the action signal reaches the UNet.
#   'cross_attn' — one action token per frame is the UNet's cross-attention
#                  context (Ctrl-World's original frame-locked conditioning).
#                  The CLIP text embedding is added into those same tokens.
#   'adaln'      — action tokens are projected per frame and summed into the
#                  timestep embedding (t_emb), which every spatial and temporal
#                  resnet already consumes via time_emb_proj. The per-frame
#                  cross-attention route is dropped; cross-attention instead
#                  carries the per-sample text embedding on its own, so text
#                  conditioning keeps using the path SVD pretrained it on.
#                  NAME: kept for parity with the WAN trainer's action_cond_mode.
#                  WAN really does have AdaLN (a scale/shift/gate table driven by
#                  temb); SVD does not — its t_emb drives FiLM-style *additive*
#                  conditioning in each resnet. So this is "inject the action into
#                  the timestep conditioning", not scale/shift/gate modulation.
#                  It is also NOT DiT's AdaLN-Zero: that zero-inits each block's
#                  modulation output so the residual gate starts at 0 and every
#                  block is identity, which is a from-scratch-stability trick.
#                  Here the pretrained SVD blocks stay exactly as they are; the
#                  only thing zeroed is the new action signal (via the encoder's
#                  zero-init linear_3), so step 0 reproduces the pretrained model.
# Adds an action_adaln_proj parameter subtree, so checkpoints are NOT compatible
# across modes. Rejected together with action_encoder_init_path: those upstream
# weights were trained for the cross-attention route.
#   'skeleton'             — the 7-dim vector actions are NOT used at all.
#                             Conditioning is a rendered 2D-kinematic-skeleton
#                             video, encoded by the SAME VAE as the RGB video so
#                             the two latent grids are element-for-element
#                             aligned, embedded by a separate zero-init conv and
#                             ADDED onto conv_in's output. SVD has no patch
#                             embedding, so conv_in's output is the analogue of
#                             WAN's patchified tokens: the earliest point that is
#                             in feature space rather than latent space. Scaled by
#                             skeleton_embed_alpha. No action encoder is built.
#   'skeleton_adaln'       — the same skeleton latents pooled to ONE vector per
#                             frame and summed into t_emb, the site the vector
#                             'adaln' route uses, so "adaln" names one site
#                             regardless of representation.
#                             IMPORTANT ASYMMETRY vs the WAN arm: SVD's t_emb is
#                             (B*T, time_embed_dim) with no spatial axis, so the
#                             skeleton grid MUST be collapsed here. That discards
#                             exactly what makes a skeleton richer than a 7-dim
#                             action, which makes this the weakest of the three
#                             skeleton routes a priori. WAN's per-token AdaLN had
#                             a spatial grid to land in and needed no pooling, so
#                             a WAN-vs-SVD skeleton_adaln comparison is NOT
#                             apples to apples. It is still the cell that
#                             isolates "does the site matter" against the vector
#                             adaln run, holding the site fixed.
#   'skeleton_cross_attn'  — the same skeleton latents as a per-frame spatial K/V
#                             grid for the SPATIAL cross-attention
#                             (skeleton_cross_attn_stride=4 -> 180 keys/frame at
#                             72x40, matching the WAN route's per-frame count).
#                             Frame locking is free: SVD's context is already
#                             (B*T, S, C), so frame k can only see frame k's keys,
#                             where WAN needed an explicit reshape.
#                             Alignment is a LEARNED positional embedding on the
#                             keys, not RoPE: SVD has no rotary embeddings
#                             anywhere, so the WAN route's parameter-free
#                             alignment has nothing to reuse. Note the queries are
#                             a different grid size at each of the three
#                             cross-attention stages while these keys are one
#                             fixed grid, so at two of the three the model must
#                             learn a resampling rather than an identity.
#                             With use_task_instructions=True the full text token
#                             rides alongside the grid as one extra key — SVD does
#                             not need WAN's pooled-bias workaround, because its
#                             context is inherently per-frame.
# All three skeleton modes require a dataset carrying skeleton_cam0/1/2 beside
# latent_cam0/1/2, encoded with the SVD VAE (NOT the WAN one — different channel
# count and downsample). None builds an action_encoder, so action_dim and
# action_encoder_init_path stop applying.
# All three are supported end to end: training, the in-training W&B video
# preview, and generate_ctrl_world.py rollout inference. The eval/inference
# dataset must carry the skeleton features too — the skeleton IS the
# conditioning signal at inference time, it is not generated.
action_cond_mode: 'cross_attn'

# Additive skeleton route only ('skeleton'). Fixed scale on the bias added onto
# conv_in's output. The conv is zero-init so step 0 is exactly the no-skeleton
# baseline whatever alpha is; alpha's real job is scaling the gradient into that
# kernel, capping how fast the skeleton path ramps up out of zero. 0.1 matches
# OSCAR's additional_embed_alpha and the WAN arm. Ignored by the other two
# skeleton routes, which deliberately have no alpha.
skeleton_embed_alpha: 0.1

# Cross-attention skeleton route only ('skeleton_cross_attn'). Spatial downsample
# of the skeleton key grid: 4 -> (72/4)*(40/4) = 180 keys per frame. Raising it
# cuts cross-attention cost quadratically in the key count; 2 gives 720
# keys/frame, which at the shallowest stage is roughly a quarter of a
# self-attention. Must divide the latent height and width.
skeleton_cross_attn_stride: 4

# Whether the DROID task instruction (the pre-computed CLIP text embedding in
# the batch) reaches the model at all. False makes the run action-only.
#
# Default True = what this model has always done. The WAN arm defaults to False
# for the same reason (it has always been text-free), so the two defaults
# differ — set this explicitly and identically in both when comparing the two
# models, otherwise the language signal is a confound.
#
# Route when enabled, matched exactly by the WAN trainer:
#   cross_attn — tiled to hidden_size and added to the action tokens, sharing
#                their cross-attention route.
#   adaln      — carried by cross-attention alone (the action has moved to the
#                timestep embedding).
# Never CFG-dropped in either mode, and costs no parameters, so it is safe to
# flip between runs without breaking checkpoint compatibility.
use_task_instructions: True

# Each cam latent is 24 rows tall; 3 cams stacked = 72.
latent_height_per_cam: 24
num_views: 3
# VAE scaling factor used to unscale the channel-concat conditioning stream.
# Must match the value applied at pre-encode time.
vae_scaling_factor: 0.18215

# ── Rollout inference (generate_ctrl_world.py) ────────────────────────────────
# Auto-regressive chunks per episode. Each chunk contributes num_frames - 1 new
# latent frames (slot 0 of the future is the current observation, which the
# previous chunk already produced), so the rollout horizon is
#   1 + ar_num_chunks * (num_frames - 1)
# = 1 + 12*4 = 49 frames ~ 10s at 5 Hz with the defaults here.
ar_num_chunks: 12
# Step to restore from checkpoint_dir; <= 0 means "latest".
checkpoint_step: -1
# Playback rate of the written MP4s. The data is 5 Hz latents (down_sample=3 from
# the 15 Hz state stream) and the SVD VAE is per-frame, so 1 latent = 1 frame.
output_video_fps: 5
# Stop after this many val episodes; -1 evaluates the whole split.
eval_max_episodes: -1
# Skip val episodes shorter than this many latent frames. Shorter-than-horizon
# episodes are still rolled out and simply trimmed back to their real length, so
# this only exists to drop degenerate 2-3 frame episodes.
eval_min_latent_frames: 2

# Below kept for pyconfig compatibility but unused by the ctrl_world trainer.
height: 192
width: 320
min_guidance_scale: 1.0
max_guidance_scale: 2.5
guidance_scale: 2.5
flow_shift: 0.0
guidance_rescale: 0.0
num_inference_steps: 25
fps: 7
save_final_checkpoint: True
fps_id: 6
motion_bucket_id: 127
cond_aug: 0.02
decode_chunk_size: 1
debug_dir: ''
vae_scale_factor: 0.18215
image_url: ''
prompt: ''
prompt_2: ''
negative_prompt: ''
do_classifier_free_guidance: True
image_encoder_pretrained_model_name_or_path: ''
lightning_from_pt: False
lightning_repo: ""
lightning_ckpt: ""
enable_lora: False
lora_config: {
  rank: [],
  lora_model_name_or_path: [],
  weight_name: [],
  adapter_name: [],
  scale: [],
  from_pt: []
}
enable_mllog: False
controlnet_model_name_or_path: ''
controlnet_from_pt: False
controlnet_conditioning_scale: 0.0
controlnet_image: ''
quantization: ''
quantization_local_shard_count: -1
compile_topology_num_slices: -1
use_qwix_quantization: False
quantization_calibration_method: "absmax"
qwix_module_path: ".*"
eval_every: 2000
eval_max_batches: 50
enable_generate_video_for_eval: False
eval_max_number_of_samples_in_bucket: 0
enable_ssim: False
enable_ml_diagnostics: False
profiler_gcs_path: ""
enable_ondemand_xprof: False

diffusion_scheduler_config: {
  prediction_type: 'v_prediction',
  sigma_min: 0.002,
  sigma_max: 700.0,
  rho: 7.0,
  timestep_spacing: 'edm'
}

tfrecords_dir: ''
no_records_per_shard: 0
enable_eval_timesteps: False
timesteps_list: []
num_eval_samples: 0

# ── Pre-encoding (droid_to_ctrl_world_tfrecords.py) ──────────────────────────
# Raw DROID root: {LAB}/{success,failure}/{date}/{timestamp}/{trajectory.h5,recordings/MP4/*.mp4}
raw_data_root: '/n/fs/iromdata/droid_raw/1.0.1'
# Output root; shards are written to data_root/{train,val}/shard-NNNN.tfrecord.
data_root: ''
# Authoritative episode_id (the "id" field) and camera/h5 paths.
video_index_path: ''
# Authoritative train/val membership by episode id. Required — the converter
# never invents a split, so every chunked job agrees on it.
split_metadata_path: ''
# Percentile action stats (state_01/state_99, 7-dim). Reused if it exists.
action_stats_path: ''
action_stats_only: False
setup_only: False
# Episode-range selection for splitting the job across many runs. Selection is
# by episode id, so chunks are disjoint and shard placement is id-derived.
start_episode: 0
max_episodes: -1
# Temporal downsampling of the RGB/latent stream. MUST equal
# ctrl_world_down_sample: the reader indexes states at rgb_id*down_sample.
rgb_skip: 3
# Cap on kept (post-skip) latent frames per episode; -1 = whole episode.
max_frames: -1

# ── Skeleton conditioning (droid_to_ctrl_world_tfrecords.py) ──────────────────
# Off by default: turning it on adds skeleton_cam0/1/2 latents alongside
# latent_cam0/1/2, rendered from the robot's joint angles with OSCAR's reference
# code and encoded with the SAME SVD VAE, so a skeleton latent is the exact
# counterpart of its RGB latent. Doubles the VAE work per episode and roughly
# doubles the bytes per record. Existing readers parse a fixed feature dict and
# ignore the extra keys, so these shards stay backward compatible.
ctrl_world_skeleton: False
skeleton_render_module: '/n/fs/cat10301/projects/oscar-public/demo/render_skeleton.py'
skeleton_urdf_path: '/n/fs/cat10301/projects/oscar-public/demo/assets/panda_robotiq.urdf'
# Draw at the video's native size then INTER_AREA-resize, matching what
# load_video_frames does to the RGB frames so the two land on the same pixels.
skeleton_render_native: True
skeleton_draw_gripper: True   # EE axes + the two Robotiq fingers
# Raw DROID reports gripper *closedness*; the renderer wants openness.
skeleton_gripper_invert: True
# Nominal ZED pinhole at 1280x720 (OSCAR's demo value); rescaled per axis.
skeleton_fx: 530.0
skeleton_fy: 530.0
skeleton_cx: 640.0
skeleton_cy: 360.0
# Optional JSON {camera_serial: [x,y,z,rx,ry,rz]} replacing the extrinsics the h5
# reports, for captures whose recorded calibration is a placeholder. Serials absent
# from the file keep the h5 value. Empty = use the h5, correct for DROID.
skeleton_extrinsics_path: ''
# Episodes to re-render + re-encode in verify_skeleton_shards.py. Each one costs a
# full render and 3 VAE encodes, so a handful is the point — this is a spot check.
verify_episodes: 3
prefetch_workers: 8
# Frames per VAE encode call. One compiled shape; higher = less dispatch overhead.
# Data-affecting: the posterior noise draw is keyed per padded chunk, so changing
# this changes the encoded latents. Keep it fixed across all jobs of one dataset.
vae_encode_chunk: 8
# CLIP text encoder producing the 512-d pooled embedding (text_embed_dim).
clip_model_name_or_path: 'openai/clip-vit-base-patch32'
