<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 460" role="img" aria-labelledby="title desc">
  <title id="title">Experiment 01 eval-on-train loss by checkpoint</title>
  <desc id="desc">Eval-on-train loss, measured every 1000 steps with fresh noise and timestep samples over four batches, declines from 0.1905 at step 1000 to 0.1784 at step 20000.</desc>
  <style>
    :root {
      color-scheme: light dark;
      --background: #ffffff;
      --text: #334155;
      --muted: #64748b;
      --grid: #e2e8f0;
      --line: #7c3aed;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --background: #0f172a;
        --text: #e2e8f0;
        --muted: #94a3b8;
        --grid: #334155;
        --line: #c4b5fd;
      }
    }
    text { fill: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 14px; }
    .muted { fill: var(--muted); }
    .grid { stroke: var(--grid); stroke-width: 1; }
    .axis { stroke: var(--muted); stroke-width: 1.5; }
    .series { fill: none; stroke: var(--line); stroke-linecap: round; stroke-linejoin: round; stroke-width: 3; }
    .point { fill: var(--background); stroke: var(--line); stroke-width: 2.5; }
  </style>
  <rect width="1000" height="460" fill="var(--background)" rx="8"/>

  <line class="grid" x1="90" y1="40" x2="950" y2="40"/>
  <line class="grid" x1="90" y1="125" x2="950" y2="125"/>
  <line class="grid" x1="90" y1="210" x2="950" y2="210"/>
  <line class="grid" x1="90" y1="295" x2="950" y2="295"/>
  <line class="grid" x1="90" y1="380" x2="950" y2="380"/>

  <line class="axis" x1="90" y1="40" x2="90" y2="380"/>
  <line class="axis" x1="90" y1="380" x2="950" y2="380"/>

  <text class="muted" x="76" y="45" text-anchor="end">0.195</text>
  <text class="muted" x="76" y="130" text-anchor="end">0.190</text>
  <text class="muted" x="76" y="215" text-anchor="end">0.185</text>
  <text class="muted" x="76" y="300" text-anchor="end">0.180</text>
  <text class="muted" x="76" y="385" text-anchor="end">0.175</text>

  <text class="muted" x="90" y="407" text-anchor="middle">1k</text>
  <text class="muted" x="271" y="407" text-anchor="middle">5k</text>
  <text class="muted" x="497" y="407" text-anchor="middle">10k</text>
  <text class="muted" x="724" y="407" text-anchor="middle">15k</text>
  <text class="muted" x="950" y="407" text-anchor="middle">20k</text>
  <text x="520" y="442" text-anchor="middle">Training step</text>
  <text transform="translate(24 210) rotate(-90)" text-anchor="middle">Eval-on-train loss</text>

  <polyline class="series" points="90.0,116.5 135.3,206.6 180.5,182.8 225.8,254.2 271.1,257.6 316.3,293.3 361.6,249.1 406.8,254.2 452.1,276.3 497.4,230.4 542.6,276.3 587.9,269.5 633.2,300.1 678.4,313.7 723.7,247.4 768.9,298.4 814.2,298.4 859.5,279.7 904.7,317.1 950.0,322.2"/>

  <circle class="point" cx="90" cy="116.5" r="4"/>
  <circle class="point" cx="950" cy="322.2" r="4"/>
  <text x="106" y="102">0.1905 @ 1k</text>
  <text x="934" y="309" text-anchor="end">0.1784 @ 20k</text>
</svg>
