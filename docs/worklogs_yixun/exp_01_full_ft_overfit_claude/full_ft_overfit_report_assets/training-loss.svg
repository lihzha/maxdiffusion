<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 460" role="img" aria-labelledby="title desc">
  <title id="title">Experiment 01 training loss by optimization step</title>
  <desc id="desc">Training loss falls from 0.601 at step 10 to 0.194 at step 500, is near its long-run plateau by step 2000, and ends at 0.176 at step 20000.</desc>
  <style>
    :root {
      color-scheme: light dark;
      --background: #ffffff;
      --text: #334155;
      --muted: #64748b;
      --grid: #e2e8f0;
      --line: #2563eb;
      --plateau: #dbeafe;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --background: #0f172a;
        --text: #e2e8f0;
        --muted: #94a3b8;
        --grid: #334155;
        --line: #60a5fa;
        --plateau: #172554;
      }
    }
    text { fill: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 14px; }
    .muted { fill: var(--muted); }
    .grid { stroke: var(--grid); stroke-width: 1; }
    .axis { stroke: var(--muted); stroke-width: 1.5; }
    .series { fill: none; stroke: var(--line); stroke-linecap: round; stroke-linejoin: round; stroke-width: 3; }
    .point { fill: var(--background); stroke: var(--line); stroke-width: 2.5; }
  </style>
  <rect width="1000" height="460" fill="var(--background)" rx="8"/>
  <rect x="176" y="40" width="774" height="340" fill="var(--plateau)" opacity="0.42"/>

  <line class="grid" x1="90" y1="54.8" x2="950" y2="54.8"/>
  <line class="grid" x1="90" y1="128.7" x2="950" y2="128.7"/>
  <line class="grid" x1="90" y1="202.6" x2="950" y2="202.6"/>
  <line class="grid" x1="90" y1="276.5" x2="950" y2="276.5"/>
  <line class="grid" x1="90" y1="350.4" x2="950" y2="350.4"/>
  <line class="grid" x1="90" y1="380" x2="950" y2="380"/>

  <line class="axis" x1="90" y1="40" x2="90" y2="380"/>
  <line class="axis" x1="90" y1="380" x2="950" y2="380"/>
  <line x1="176" y1="40" x2="176" y2="380" stroke="var(--line)" stroke-dasharray="5 5" opacity="0.65"/>

  <text class="muted" x="76" y="59" text-anchor="end">0.60</text>
  <text class="muted" x="76" y="133" text-anchor="end">0.50</text>
  <text class="muted" x="76" y="207" text-anchor="end">0.40</text>
  <text class="muted" x="76" y="281" text-anchor="end">0.30</text>
  <text class="muted" x="76" y="355" text-anchor="end">0.20</text>
  <text class="muted" x="76" y="385" text-anchor="end">0.16</text>

  <text class="muted" x="90" y="407" text-anchor="middle">0</text>
  <text class="muted" x="305" y="407" text-anchor="middle">5k</text>
  <text class="muted" x="520" y="407" text-anchor="middle">10k</text>
  <text class="muted" x="735" y="407" text-anchor="middle">15k</text>
  <text class="muted" x="950" y="407" text-anchor="middle">20k</text>
  <text x="520" y="442" text-anchor="middle">Training step</text>
  <text transform="translate(24 210) rotate(-90)" text-anchor="middle">Masked velocity MSE</text>

  <polyline class="series" points="90.4,54.0 92.2,71.0 98.6,331.6 111.5,354.9 133.0,360.3 176.0,363.0 219.0,364.1 262.0,362.6 305.0,365.8 348.0,364.5 391.0,365.5 434.0,362.0 477.0,367.3 520.0,366.3 563.0,364.3 606.0,367.8 649.0,365.1 692.0,367.0 735.0,368.7 778.0,366.0 821.0,366.8 864.0,367.7 907.0,367.4 950.0,368.0"/>

  <circle class="point" cx="90.4" cy="54" r="4"/>
  <circle class="point" cx="111.5" cy="354.9" r="4"/>
  <circle class="point" cx="176" cy="363" r="4"/>
  <circle class="point" cx="950" cy="368" r="4"/>
  <text x="106" y="47">0.601 @ 10</text>
  <text x="128" y="331">0.194 @ 500</text>
  <text x="190" y="349">0.183 @ 2k</text>
  <text x="934" y="352" text-anchor="end">0.176 @ 20k</text>
  <text x="193" y="66" fill="var(--line)">Near long-run plateau by ~2k</text>
</svg>
